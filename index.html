t", "sub": "Expiry schedule", "r": "Display a customer's point-expiry schedule by date and quantity.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each point lot gets its own expiry date when the points are earned. The bank portal shows each customer’s expiry schedule: the number of points that expire on each date. The balance API returns the same schedule, so the bank’s app and the Lune SDK can show customers which points expire and when."}, "LAF-37": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer export", "r": "Export complete or filtered customer, profile, balance, activity and transaction data subject to access permissions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Banks read customer, cashback and transaction records through the bank portal API."}, "LAF-38": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Manual adjustment", "r": "Allow authorised users to add or remove points with transaction date, amount, product, narration, reason and supporting description.", "pr": "Must-have", "c": "Fully Compliant", "a": "On the bank's request, Lune's team can add or remove cashback or points with the transaction date, amount, product, description, reason and supporting note. Each adjustment is a new, permanent ledger entry."}, "LAF-39": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Manual adjustment control", "r": "Route manual point adjustments through maker-checker approval and prevent self-approval.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each correction needs a written request from the bank before Lune's team makes it, so two parties approve it."}, "LAF-4": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Reusable market rollout", "r": "Support reusable implementation assets, integrations, configurations and operating processes so additional issuers and markets can be onboarded efficiently.", "pr": "Must-have", "c": "Fully Compliant", "a": "All banks use the same API, the same file format and the same bank portal."}, "LAF-40": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Sensitive data", "r": "Mask or suppress OTPs, passwords, voucher codes and other sensitive content in customer views and communication history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Full card numbers are not part of the data flow: the platform uses the card BIN and, if sent, the last four digits. Sign-in codes for portal users go by email and are not shown on screens."}, "LAF-41": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Language preference", "r": "Maintain preferred and secondary customer languages and apply a configurable fallback language.", "pr": "Must-have", "c": "Partially Compliant", "a": "Merchant brand names support English and Arabic."}, "LAF-42": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Bulk customer file", "r": "Support validated bulk customer creation and update through scheduled secure file exchange using a documented template.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform learns customers from the bank's transactions, sent through the API or SFTP files, so a separate customer file is not needed."}, "LAF-43": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer API", "r": "Support real-time customer creation, update, activation and retrieval through secure APIs.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank's app activates and retrieves offers for a customer through our API in real time. Customers are created automatically from the bank's transactions."}, "LAF-44": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Bulk actions", "r": "Support new, update and suspend actions in customer files, with row-level validation and error reporting.", "pr": "Must-have", "c": "Partially Compliant", "a": "Transaction files over SFTP create and update customers automatically, and the bank can query the status of each file."}, "LAF-45": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Card reference data", "r": "Ingest and maintain card or relationship reference data needed to associate transactions with customers without exposing full PAN to unauthorised users.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each transaction carries the bank's customer reference, so no full card number is needed. Cashback uses the card BIN, and the bank registers its card products by BIN in the bank portal."}, "LAF-46": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Card lifecycle", "r": "Maintain card product, status, issue date, expiry date and approved masked identifiers, and process updates with validation logs.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank keeps its card products by BIN in the bank portal, with a full change history."}, "LAF-47": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Multiple identifiers", "r": "Associate a customer with multiple cards, accounts, wallets or partner identifiers while maintaining one controlled loyalty identity.", "pr": "Must-have", "c": "Fully Compliant", "a": "A customer's cards and accounts in one bank all earn under one customer reference."}, "LAF-48": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Household and pooled accounts", "r": "Support household, family, corporate or pooled memberships with configurable earning, spending and permission rules.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Offer campaigns can be configured against particular card programs."}, "LAF-49": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Identity resolution", "r": "Provide controlled duplicate detection, merge, split and survivorship rules without losing balances, transactions or audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank's customer reference is the single identity, so one bank cannot have duplicate customers in the platform."}, "LAF-5": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "White-label delivery", "r": "Support Mastercard-led, issuer-led and co-branded propositions without exposing the underlying technology vendor to customers unless agreed.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers go to the bank's own app through our SDK. The bank approves each offer details before customers see them."}, "LAF-50": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Consent and preferences", "r": "Capture and enforce programme terms acceptance, privacy consent, marketing permissions and channel preferences with version and timestamp.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer shows its terms and conditions before activation. The platform records each activation, with its time, as the customer's acceptance."}, "LAF-51": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Data-subject lifecycle", "r": "Support authorised access, correction, portability, restriction, anonymisation and deletion workflows subject to financial and regulatory retention.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps no names or contact details, only pseudonymised references. Transaction retention is set for each bank, and Lune deletes a bank's data on request."}, "LAF-52": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Partner hierarchy", "r": "Maintain issuer, merchant, coalition, sponsor and service-partner profiles and their programme relationships.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps banks and merchants, with each merchant's brands, outlets (merchant IDs) and terminals. The merchant is the funding partner of each campaign."}, "LAF-53": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Funding attribution", "r": "Attribute each point issuance, reversal, redemption and expiry to the applicable funding party or funding split.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each cashback or points issuance, reversal, redemption and expiry records its funding party or funding split"}, "LAF-54": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Co-funding", "r": "Support configurable co-funded activity with percentage, fixed or rule-based allocation between funding parties.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune admin sets the funding parties for each campaign and the allocation between them, as a percentage or a fixed amount, as the commercial agreement states. Allocation also follows rules by card product and tier: the merchant pays the campaign rate, and the bank pays the extra for premium cards and higher tiers. Each funding party receives a statement of its share."}, "LAF-55": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Funding budgets", "r": "Maintain partner and campaign funding limits, utilisation, reservation and exhaustion controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has a budget. The platform tracks how much of it is used, and it closes the campaign automatically when the budget is used up."}, "LAF-56": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Partner settlement", "r": "Calculate partner-level accrual, redemption, reversal, fee and adjustment obligations for an agreed settlement period.", "pr": "Must-have", "c": "Fully Compliant", "a": "For each campaign, the platform calculates cashback earned, reversed and payable at any date."}, "LAF-57": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Settlement adjustments", "r": "Support controlled disputes, corrections and carry-forward adjustments with reason and approval history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Every cashback figure links to its source transaction, which helps to answer settlement questions."}, "LAF-58": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Invoices and statements", "r": "Generate partner statements and invoice-support data with transaction-level traceability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each cashback entry links to its source transaction, so partner totals are fully traceable. Merchant reports will show the figures for each campaign."}, "LAF-59": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Financial reconciliation", "r": "Reconcile partner funding and settlement totals to the points ledger and source transactions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Partner funding and settlement totals reconcile to the cashback and points ledger and to each source transaction"}, "LAF-6": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Modular adoption", "r": "Allow issuers to adopt the accrual engine, ledger, tiers, campaigns, reporting or other modules independently or as an integrated platform.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each module is turned on by configuration for each bank. Campaigns, the accrual engine, the ledger and reporting are live, and work together as one set. Tiers sit on top of the accrual engine and the ledger, and a bank can turn them on or off."}, "LAF-60": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Partner interfaces", "r": "Support secure partner files and APIs for eligibility, activity, settlement and reconciliation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Banks use the bank portal API for campaigns, card selection and the cashback log. Merchants get campaign analytics through the merchant reporting."}, "LAF-61": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Partner access", "r": "Provide appropriately segregated partner access to authorised programme, financial and operational information.", "pr": "Nice-to-have", "c": "Fully Compliant", "a": "Each bank sees only its own campaigns and cashback. Each merchant sees only its own campaigns."}, "LAF-62": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Partner Funding & Settlement", "sub": "Fees and commercial rules", "r": "Calculate configured transaction, service, conversion or partner fees separately from point value and liability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Transaction, service and partner fees are agreed in the commercial contract, and kept separate from point value and liability."}, "LAF-63": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Issuer integration", "sub": "Issuer source systems", "r": "Integrate with issuer card management, core banking, digital banking, CRM/CDP, data platforms, payment processors and communication systems through standard interfaces.", "pr": "Must-have", "c": "Fully Compliant", "a": "Banks send transactions through a secure REST API or SFTP files. The bank's app uses our API and SDK for offers and activations."}, "LAF-64": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Issuer integration", "sub": "Integration independence", "r": "Do not require a specific core-banking, card-management, middleware or digital-banking product unless explicitly disclosed as a dependency.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform needs no specific core-banking, card or middleware product. Any system that can call a REST API can send transactions."}, "LAF-65": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Real-time ingestion", "r": "Accept accrual and adjustment transactions through secure, authenticated APIs with documented request, response and error codes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Banks send purchases and refunds through an authenticated, documented API. The platform calculates cashback once a day."}, "LAF-66": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Batch ingestion", "r": "Accept scheduled transaction files through approved secure transfer channels using a documented schema.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform takes transaction data over secure API with a documented schema.."}, "LAF-67": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Validation", "r": "Validate required fields, data types, customer references, product codes, transaction dates, amounts and unique transaction identifiers before processing.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform checks the required fields, card BIN, currency, time, merchant ID and transaction ID of each transaction. It records the reason when a transaction cannot earn cashback."}, "LAF-68": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Error handling", "r": "Reject or quarantine invalid records without preventing valid records from processing, and provide row-level error reasons.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps all valid transactions. A transaction with incomplete cashback data cannot earn, and the platform records the reason. Refunds with no known original purchase are held and checked again automatically."}, "LAF-69": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Processing logs", "r": "Provide file/API processing status, accepted/rejected counts, timestamps, error details and downloadable logs.", "pr": "Must-have", "c": "Partially Compliant", "a": "Banks can query the status of each API request, and Lune's team monitors data quality for each bank."}, "LAF-7": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Coexistence", "r": "Coexist and exchange data with Mastercard loyalty, offers, rewards, redemption and servicing platforms where required.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform uses standard secure REST APIs, so it can run next to Mastercard loyalty, offers and redemption platforms."}, "LAF-70": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Idempotency", "r": "Prevent duplicate processing through unique transaction identifiers and idempotent API/file controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank sends its own transaction ID, and a resent transaction does not create a duplicate. A purchase earns at most once per campaign, and a refund reverses at most once."}, "LAF-71": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Duplicate logic", "r": "Support configurable duplicate-detection and preprocessing logic using relevant customer, merchant, terminal, date, amount or reference attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform detects duplicates by the bank's transaction ID, and a purchase earns at most once per campaign."}, "LAF-72": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Transaction attributes", "r": "Support standard transaction attributes including ID, type, date, amount, currency, product, sub-product and customer reference.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each transaction carries its ID, type (purchase or refund), date and time, amount, currency, customer reference, card BIN, merchant ID and terminal ID."}, "LAF-73": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Custom transaction attributes", "r": "Allow programme-specific transaction attributes with configurable data type, mandatory status, default value and permitted values.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each transaction has a standard set of fields with fixed data types and mandatory rules, including the card BIN, which links the purchase to the bank’s card product. The platform checks the fields when the bank sends the transaction. Lune enrichment adds merchant, brand, category and subcategory, and campaigns use these fields. Lune’s team adds new fields for a bank on request."}, "LAF-74": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Product catalogue", "r": "Maintain product and sub-product codes, names, status and programme mapping through UI, bulk upload or API.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank keeps its card products and sub-products in the bank portal, each with its BINs, name and status (active or inactive). Each transaction carries the card BIN, so the platform knows the product of every purchase. Campaigns select which products earn"}, "LAF-75": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Transaction types", "r": "Support configurable credit, debit, reversal, cancellation, bonus, expiry, redemption and adjustment transaction types.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform takes purchases and refunds. Its ledger has three entry types: cashback earned, cashback reversed and cashback disqualified."}, "LAF-76": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Event ordering", "r": "Handle late, duplicate and out-of-order events using defined posting and correction rules.", "pr": "Must-have", "c": "Fully Compliant", "a": "Purchases are processed in the order they happened. Transactions up to 3 days late are processed automatically, and duplicates are ignored. A refund that arrives before its purchase is held and checked again."}, "LAF-77": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Reprocessing", "r": "Provide controlled reprocessing of failed or corrected records without duplicate point issuance.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune's team can run any past day again, and this never creates a duplicate."}, "LAF-78": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Reconciliation", "r": "Reconcile source record counts and values to processed, rejected, pending and reversed outcomes.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform records one outcome for each purchase or refund that it checks: earned, rejected with a reason, reversed or ignored. Thus all counts reconcile."}, "LAF-79": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Non-payment events", "r": "Ingest eligible non-payment events such as referrals, engagement, servicing, product holding or milestone completion.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform takes non-payment events from the bank, such as referrals, engagement, product holding and milestone completion. The bank sets the points it gives for each event, and pays for them."}, "LAF-8": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Migration portability", "r": "Support controlled migration from an incumbent loyalty engine and future migration to another Mastercard or issuer-selected platform without loss of balances or history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune loads each bank's transaction history through the standard API, and keeps all records for each bank. At exit, Lune exports the bank's data on request."}, "LAF-80": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Merchant and channel context", "r": "Capture merchant, merchant category, terminal, channel, geography, wallet and partner attributes when supplied.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each transaction keeps the merchant ID, terminal ID, MCC and channel (online or in-store). Our enrichment adds the merchant name, category and location."}, "LAF-81": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Event streaming", "r": "Support near-real-time event streaming or messaging integration in addition to synchronous APIs and files.", "pr": "Must-have", "c": "Partially Compliant", "a": "Banks send transactions through the real-time API as they happen, and the platform enriches each request at once."}, "LAF-82": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Currency normalisation", "r": "Normalise multi-currency transactions using governed exchange-rate sources while retaining the original amount and currency.", "pr": "Must-have", "c": "Partially Compliant", "a": "The platform keeps each transaction's original amount and currency."}, "LAF-83": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Event & Transaction Processing", "sub": "Retroactive processing", "r": "Support authorised retroactive accrual and recalculation for corrected, late or previously missed eligible activity.", "pr": "Must-have", "c": "Fully Compliant", "a": "Transactions up to 3 days late earn automatically. Lune's team can run an older day again on request."}, "LAF-84": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule hierarchy", "r": "Route transactions through configurable rule groups and rules using a documented priority and execution sequence.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign is one earn rule. The checks inside a campaign have a fixed, documented order, and every qualifying campaign pays."}, "LAF-85": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule groups", "r": "Create rule groups scoped by programme, product and sub-product with validity dates, priority and status.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has merchant outlets, eligible card products, an audience, start and end dates, and a status."}, "LAF-86": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule group caps", "r": "Configure monthly and lifetime point limits at rule-group level.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has cashback or points limits for each customer, monthly and over the whole campaign."}, "LAF-87": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule criteria", "r": "Build rules using customer, transaction, product and programme attributes without vendor code changes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Campaign terms are set by configuration: merchant outlets, terminals, cards, minimum spend, rate, cap, budget and dates. Lune's team defines the audience from transaction history. No code change is needed."}, "LAF-88": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Logical operators", "r": "Support AND/OR condition logic, comparison operators, ranges, lists and date-based criteria.", "pr": "Must-have", "c": "Fully Compliant", "a": "Campaign audiences use full logic: AND, OR, comparisons, ranges, lists and dates."}, "LAF-89": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Flat accrual", "r": "Award a fixed number of points when a transaction meets the configured criteria.", "pr": "Must-have", "c": "Fully Compliant", "a": "A campaign can award a fixed number of points for each qualifying purchase."}, "LAF-9": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Multi-programme architecture", "r": "Support multiple independent loyalty programmes in one deployment while segregating programme data, users, customers, rules, balances, reports and configuration.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bank is a separate tenant in the shared deployment, and its loyalty programme sits inside that tenant. Every customer, transaction, campaign, ledger entry and report carries the tenant ID, and the platform separates data by it. Each user account and API credential belongs to one tenant, so a bank’s users and systems reach only their own programme. Only authorised Lune operations staff work across tenants, and their access is logged"}, "LAF-90": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Multiplier accrual", "r": "Award points by multiplying an eligible transaction amount or base accrual by a configurable rate.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign sets a rate that multiplies the eligible purchase amount, for example 5%. A bonus campaign can multiply this base accrual, for example double points at a merchant for one month."}, "LAF-91": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "For-every logic", "r": "Award points for every configured unit of value, quantity or occurrence, with explicit rounding treatment.", "pr": "Must-have", "c": "Fully Compliant", "a": "A campaign can award points for every set amount spent, for example 10 points for every AED 5. The part of the amount that does not complete a step earns nothing, or the programme can choose to round up or half-up. Card transactions carry no item quantities, so awards are based on value."}, "LAF-92": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Tier multiplier", "r": "Apply a tier-specific multiplier or benefit to an otherwise eligible accrual.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each tier has its own multiplier or bonus, which applies to the campaign’s rate for an eligible purchase. For example, Gold customers earn 1.5 times the campaign rate. The bank pays the extra above the campaign rate."}, "LAF-93": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Multiple rule groups", "r": "Allow a transaction to earn across multiple applicable rule groups where configured.", "pr": "Must-have", "c": "Fully Compliant", "a": "One purchase earns on every campaign it qualifies for, and each reward is recorded separately against the purchase."}, "LAF-94": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "First-match control", "r": "Allow first-match processing within a group so that lower-priority rules are not applied after a qualifying rule.", "pr": "Must-have", "c": "Fully Compliant", "a": "A bank can group campaigns and give each one a priority. In a group, only the highest-priority campaign that qualifies pays, and the lower-priority campaigns do not."}, "LAF-95": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule priority", "r": "Allow authorised users to reorder rule and rule-group priority with effective dating and audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune admin can change the priority of campaigns and campaign groups, with a date from which the change applies. Each change goes through approval and is kept in the audit history."}, "LAF-96": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule lifecycle", "r": "Support draft, pending approval, active, disabled, expired, archived and restored rule states.", "pr": "Must-have", "c": "Fully Compliant", "a": "A campaign goes through draft, review, bank approval or rejection, scheduled, live and completed."}, "LAF-97": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Validity controls", "r": "Prevent activation of rules with invalid or expired effective dates and warn users before expiry.", "pr": "Must-have", "c": "Fully Compliant", "a": "Start and end dates cannot be in the past, and the end must be after the start. A bank cannot accept a campaign after its end date."}, "LAF-98": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule validation", "r": "Validate mandatory fields, attribute compatibility, numeric ranges, overlapping conditions and cap logic before activation.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform checks required fields and value ranges, for example the rate and the budget. Lune's team tests the audience before the bank sees the campaign."}, "LAF-99": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule simulation", "r": "Simulate or test proposed rules against sample transactions before production activation and show the calculated outcome.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune's team tests each campaign audience and sees the number of matching customers before launch."}, "LIT-1": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Deployment & integration", "sub": "Mastercard integration", "r": "Support secure integration with applicable Mastercard platforms and services using Mastercard-approved connectivity, authentication and data-exchange standards.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform uses secure REST APIs, with TLS 1.2 or higher. Lune connects to Mastercard platforms through these interfaces."}, "LIT-10": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Balance API", "r": "Provide an API to retrieve available, pending and other permitted balance components.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank portal API returns, for each campaign, the cashback earned, reversed, balance and payable status of each purchase."}, "LIT-11": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Redemption API", "r": "Provide an API to validate and post a redemption against available points, with unique reference and reason codes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Customers redeem points in the bank’s app through the Lune SDK. The redemption API checks each request against the customer’s available balance and posts it with a unique reference."}, "LIT-12": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Reversal API", "r": "Provide an API to reverse an eligible accrual or redemption using the original transaction reference.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank sends a refund through the transaction API with the original transaction ID, and the platform reverses the cashback."}, "LIT-13": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Error handling", "r": "Return consistent HTTP/status codes, business reason codes and correlation identifiers across APIs.", "pr": "Must-have", "c": "Fully Compliant", "a": "The APIs use standard HTTP status codes. The platform records a business reason code for each cashback decision."}, "LIT-14": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Resilience", "r": "Support timeouts, retries, circuit-breaking and idempotency appropriate to each integration.", "pr": "Must-have", "c": "Fully Compliant", "a": "Transaction intake is idempotent on the bank's transaction ID. Background tasks retry automatically after a failure."}, "LIT-15": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Monitoring", "r": "Expose integration health, latency, throughput and error metrics and provide alerting for agreed thresholds.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune's team monitors integration health, latency, throughput and errors, with alerts."}, "LIT-16": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Integration & APIs", "sub": "Webhooks", "r": "Publish secure, retryable events for balance, accrual, redemption, expiry, tier, customer and processing-status changes.", "pr": "Must-have", "c": "Partially Compliant", "a": "Banks can query the status of each file."}, "LIT-2": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Deployment & integration", "sub": "Deployment flexibility", "r": "Clearly describe SaaS, dedicated cloud, private cloud and on-premises options and the responsibilities, limitations and costs of each.", "pr": "Must-have", "c": "Fully Compliant", "a": "Our primary delivery model is SaaS, hosted on public cloud providers such as Azure and OCI, where we manage the infrastructure, application deployment, maintenance, and operations. Dedicated cloud deployments can be considered based on agreed customer requirements. Private cloud and on-premises options are subject to technical feasibility and assessment. For each deployment model, infrastructure and operational responsibilities, technical limitations, and associated costs are defined based on the agreed scope and contractual requirements."}, "LIT-20": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Security, Privacy & Access", "sub": "Granular permissions", "r": "Control view, create, edit, approve, delete, export and personal-information access by module and programme.", "pr": "Must-have", "c": "Fully Compliant", "a": "Permissions come from the fixed roles. Names, contact details and full card numbers are not part of the data flow."}, "LIT-21": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Security, Privacy & Access", "sub": "Programme scoping", "r": "Restrict users and roles to authorised programmes and prevent unauthorised cross-programme access.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bank user can access only their own bank's data. The platform checks this on every request."}, "LIT-28": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Security, Privacy & Access", "sub": "Audit trail", "r": "Record administrative actions with user, role, programme, action, object, timestamp, browser/IP and outcome.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps a change history, with the user and the time, for key records such as banks, campaigns, card products and staff users."}, "LIT-30": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Security, Privacy & Access", "sub": "Data retention", "r": "Apply configurable retention, archival and deletion policies to operational, personal, audit and report data.", "pr": "Must-have", "c": "Fully Compliant", "a": "Transaction retention is set for each bank, and the platform deletes older transactions automatically. Lune deletes all data of a bank when the contract ends."}, "LIT-40": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Non-Functional, Hosting & Resilience", "sub": "Network integration", "r": "Support private connectivity, VPN, secure SFTP and approved object storage without dependence on unauthorised public services.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform supports SFTP over SSH and HTTPS APIs with TLS 1.2 or higher."}, "LIT-45": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Non-Functional, Hosting & Resilience", "sub": "Data residency", "r": "Support agreed data-residency, sovereignty and cross-border transfer requirements.", "pr": "Must-have", "c": "Fully Compliant", "a": "We deploy our services on public cloud providers such as Azure and OCI, with cloud regions selected based on agreed requirements and applicable data residency regulations. Each market has its own in-country deployment for customer and transaction data, where required. Data residency, sovereignty, and cross-border data transfer requirements are addressed based on local regulations and contractual agreements."}, "LIT-5": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Environment management", "sub": "Configuration promotion", "r": "Promote approved configuration between environments using controlled, repeatable and auditable processes, with maker-checker approval required before production promotion and prevention of self-approval.", "pr": "Must-have", "c": "Fully Compliant", "a": "Releases go through a controlled promotion from development to staging to production."}, "LIT-89": {"p": "Loyalty Accrual Engine", "s": "Implementation & Technical | Deployment & Release Management", "sub": "Change visibility", "r": "Display the exact configuration changes made to campaigns, rules, segments and other governed objects, including before/after values, actor, timestamp, approval status and target environment.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps before and after values, the user and the time for changes to campaigns and card products."}, "MS-1": {"p": "Merchant Sourcing", "s": "1. Coverage Strategy", "sub": "Geography", "r": "Support merchant sourcing across domestic, regional and cross-border markets, with the ability to define country, city, catchment area and travel-corridor coverage targets.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will operate a hybrid merchant sourcing model combining direct engagement with strategic merchants and established sourcing partners, affiliate networks and aggregators to support domestic, regional and cross-border coverage. Market, city and travel-corridor targets will be agreed with Mastercard."}, "MS-10": {"p": "Merchant Sourcing", "s": "2. Offer Portfolio", "sub": "Offer Types", "r": "Source always-on, seasonal, limited-time, event-led, flash, acquisition, retention and invitation-only offers according to Mastercard briefs.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will support sourcing of always-on, seasonal, limited-time, event-led, flash, acquisition, retention and invitation-only offers in line with Mastercard campaign briefs and merchant commercial availability."}, "MS-12": {"p": "Merchant Sourcing", "s": "2. Offer Portfolio", "sub": "Customer Segments", "r": "Source offers suitable for issuer-provided or Mastercard-defined segments without requiring the sourcing vendor to perform PCLO personalisation or card-linked decisioning.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will source merchant offers suitable for Mastercard- or issuer-defined customer segments without requiring the sourcing function to perform customer-level personalization or card-linked decisioning. Segment eligibility requirements will be documented for downstream activation."}, "MS-16": {"p": "Merchant Sourcing", "s": "2. Offer Portfolio", "sub": "Exclusivity", "r": "Identify whether each offer is exclusive, semi-exclusive or publicly available and disclose channel, issuer, market and competitor restrictions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will identify and document whether each offer is exclusive, semi-exclusive or publicly available, including applicable channel, issuer, market and competitor restrictions, supported by merchant or authorized partner confirmation."}, "MS-17": {"p": "Merchant Sourcing", "s": "2. Offer Portfolio", "sub": "Promo Codes", "r": "Where promotional codes are used, secure adequate code inventory, validity, usage rules and replenishment obligations and hand off required code data to the OMS.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will coordinate provision of valid promotional code inventory, usage rules, expiry dates, limits and replenishment obligations through direct merchants or sourcing partners, and provide the required information to the designated OMS/operator."}, "MS-2": {"p": "Merchant Sourcing", "s": "1. Coverage Strategy", "sub": "Geography", "r": "Distinguish domestic offers from cross-border/travel-destination offers and report pipeline, contracted merchants and live coverage separately.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will maintain separate sourcing pipelines and reporting for domestic and cross-border offers, including contracted merchants, geographic eligibility, live-offer status and applicable coverage."}, "MS-3": {"p": "Merchant Sourcing", "s": "1. Coverage Strategy", "sub": "Category Planning", "r": "Source merchants against Mastercard-defined category priorities and minimum category coverage targets.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will align direct and partner-led merchant sourcing with Mastercard-defined category priorities and minimum coverage targets, allocating sourcing resources according to agreed market requirements."}, "MS-31": {"p": "Merchant Sourcing", "s": "4. Offer Commercial Negotiation", "sub": "Budget", "r": "Secure and monitor committed merchant budgets or inventory limits and identify risks of early exhaustion before launch.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will coordinate monitoring of merchant funding budgets, offer inventory limits and available consumption indicators, using data provided by merchants, sourcing partners and designated campaign systems, and escalate early-exhaustion risks."}, "MS-5": {"p": "Merchant Sourcing", "s": "1. Coverage Strategy", "sub": "Merchant Mix", "r": "Maintain an agreed mix of local, regional and global brands and distinguish newly sourced merchants from existing Mastercard relationships.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will source a mix of local, regional and international brands through direct engagement and sourcing partners, distinguishing newly sourced relationships from existing Mastercard relationships to prevent duplicate sourcing claims."}, "MS-55": {"p": "Merchant Sourcing", "s": "7. Reporting & Governance", "sub": "Commercial Boundary", "r": "Confirm unsuccessful outreach is non-chargeable and that reuse across issuers does not trigger a repeated full merchant-sourcing fee.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune confirms unsuccessful outreach will be non-chargeable. Reuse of existing merchant relationships or contractual rights across issuers will not automatically trigger repeated full merchant sourcing fees. Incremental market, campaign or bespoke charges will follow the agreed commercial framework and approvals."}, "MS-7": {"p": "Merchant Sourcing", "s": "1. Coverage Strategy", "sub": "Pipeline", "r": "Maintain a transparent sourcing pipeline with merchant, market, category, owner, stage, target launch date, dependency, risk and next action.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will maintain a consolidated sourcing pipeline for direct and partner-sourced merchants, including merchant, market, category, accountable owner, commercial stage, target launch date, dependencies, risks and next actions."}, "OM-1.1": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Support percentage-discount, fixed-value discount, free-format benefit, promotional-code, product/SKU-based, bundle and value-added benefit offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Percentage, fixed-value cashback and promo-code offers are fully supported, each with a benefit cap, minimum spend, budget, validity window and store assignment. Free-format and value-added benefits are presented through offer content. SKU and bundle offers are not supported."}, "OM-1.10": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Validate mandatory content, commercial rules, dates, store assignments, channel assets, code inventory and redemption instructions before publication.", "pr": "Must-have", "c": "Fully Compliant", "a": "Before an offer can go live, the platform checks it has its required content, valid commercial rules and valid dates. It also checks the store/terminal assignments and audience targeting."}, "OM-1.11": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Provide an instant offer preview and controlled test/approval environment before release to production channels.", "pr": "Must-have", "c": "Fully Compliant", "a": "Admins and bank reviewers see a full preview of the offer as customers will see it before approving it. Audience targeting can be test-run before release, and a separate staging environment is available for end-to-end testing."}, "OM-1.12": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Prevent publication of expired, unapproved, incomplete or commercially inconsistent offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "An offer can only go live after both platform and bank approval and only from the allowed preceding status. Offers with missing content, invalid commercial rules or past dates fail validation and cannot be published."}, "OM-1.13": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Catalogue & Search", "r": "Support configurable categories, sub-categories, tags, attributes, brands, locations and catalogue collections, including portal-specific taxonomies.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers are organized by merchant, brand, category, sub-category and region, with brand categories, sub-categories and labels coming from the platform’s merchant enrichment data. Tags, collections and taxonomies specific to each portal or tenant can be configured."}, "OM-1.14": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Catalogue & Search", "r": "Provide an operational offer list showing offer title, type, status, validity, assigned stores, codes available, validations and redemptions, with search, filter and sort controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "The admin and merchant portals list offers with title, type, status, validity dates, assigned stores, activations and redemptions, plus status counts. The list can be searched, filtered and sorted."}, "OM-1.15": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Catalogue & Search", "r": "Support multiple languages, right-to-left presentation, local date/time formats and market-specific offer-content variants.", "pr": "Must-have", "c": "Fully Compliant", "a": "Brand names and categories are stored in multiple languages. Offer content can be localised per language and market. Right-to-left layout and local date/time formats are handled in the frontend app."}, "OM-1.16": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Support multiple currencies and clearly identify the currency applicable to thresholds, discounts and displayed values.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer is set up in single ISO 4217 currency code that must match the merchant's request currency, and all its amounts are stored and shown in that currency."}, "OM-1.17": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Catalogue & Search", "r": "Detect potential duplicate offers using configurable merchant, title, validity, location and commercial-rule criteria.", "pr": "Must-have", "c": "Fully Compliant", "a": "Possible duplicate offers are flagged using configurable checks on merchant/brand, title, validity period, assigned stores and commercial terms. Bank reviewers can also reject an offer for overlapping with an existing one."}, "OM-1.18": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Capture and display core offer content including title, brand, logo, images, discount or benefit value, description, validity days/times, terms and conditions, city/location and customer redemption instructions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer has a title, brand, logo, cover and promotional images, a cashback value, a description and validity dates. It also carries T&Cs, its region and assigned stores and step-by-step customer instructions."}, "OM-1.19": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Collaboration & Authoring", "r": "Provide record-level check-in/check-out, locking or equivalent collision controls for simultaneous multi-user offer editing, including clear lock ownership, timeout/release and prevention or resolution of conflicting updates.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers are locked for editing once they leave internal review. Simultaneous edits are caught with optimistic locking. Each record shows who last edited it and a conflicting update is rejected."}, "OM-1.2": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Support cashback-style offer content for display and campaign configuration, with transaction-linked qualification and settlement governed by the PCLO requirements where applicable.", "pr": "Must-have", "c": "Fully Compliant", "a": "Cashback offers are authored in the OMS with display content and campaign settings. On bank approval, offers are sent for transaction matching, qualification and cashback settlement."}, "OM-1.3": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Support merchant-funded, issuer-funded, Mastercard-funded and co-funded offer constructs, with the funding party recorded against each offer.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchant, issuer and co-funded offers are supported, and funding arrangements are managed outside the authoring flow. The funding party receives a statement of qualifying transactions and is billed for the total."}, "OM-1.4": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Configure minimum spend, maximum discount or benefit, redemption quantity, customer usage limits, qualifying or excluded products, applicable stores, days and time windows.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer can set a minimum spend, a cap per transaction, a cap per customer for the campaign, a total budget, a validity window and the stores (MIDs/TIDs) it applies to.", "triage": "now"}, "OM-1.5": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Support always-on, limited-time, seasonal, event-based, flash-sale and invitation-only offers, including scheduled seasonal catalogue placement.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers run either for fixed dates or until their budget is exhausted. Offers go live and expire automatically on their scheduled dates, which covers limited-time, seasonal, event-based and flash-sale campaigns. Invitation-only offers are targeted to a selected customer audience."}, "OM-1.6": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Provide a controlled workflow to draft, configure, review, approve, schedule, publish, pause, expire, withdraw and archive offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers go through the following status- draft, internal review (and configure), bank review and approval or rejection, then scheduled go-live and automatic expiry.  Each step is a status change made by an authorised user.  Admins can also change an offer’s status directly, including pausing, resuming or withdrawing it."}, "OM-1.7": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Support configurable maker-checker and multi-level approval workflows by tenant, market, issuer, merchant and offer type.", "pr": "Must-have", "c": "Partially Compliant", "a": "Every offer goes through two levels of approval- Lune’s internal review, then the issuing bank’s review. Role-based access (reader, writer, super-admin) controls who can make and approve changes."}, "OM-1.9": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Maintain immutable version history, effective dates, approval records and an audit trail for every offer and content change.", "pr": "Must-have", "c": "Fully Compliant", "a": "Every offer and content change is kept as a version with the user, timestamp and changed values, alongside effective dates and status-change timestamps. Bank approval decisions are recorded in the same audit trail."}, "OM-10.4": {"p": "OMS", "s": "OM-10 — Implementation & Support", "sub": "Implementation & Support", "r": "Provide proactive monitoring of integrations, publishing, redemptions, code inventory, merchant availability and platform health.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune monitors integrations, offer publishing, cashback processing, merchant store mapping and platform health around the clock, with automated alerts to the support team. Code availability from the network feed is monitored."}, "OM-11.1": {"p": "OMS", "s": "OM-11 — Offer Operations & Lifecycle Management", "sub": "Intake & Governance", "r": "Provide a structured offer-request and intake workflow before configuration begins, including mandatory fields, dependency tracking, accountable owner, target launch date, approval routing and rejection/rework handling.", "pr": "Must-have", "c": "Fully Compliant", "a": "Every offer starts as a structured campaign request with mandatory fields (budget, cashback terms, dates, goals, stores), an accountable owner and a target launch date. Requests go through internal review and then bank approval, and a rejected request is returned with reasons so it can be reworked."}, "OM-11.11": {"p": "OMS", "s": "OM-11 — Offer Operations & Lifecycle Management", "sub": "Maintenance & Exceptions", "r": "Provide actionable operational exception queues for configuration defects, merchant/MID issues, approval backlogs, redemption or code failures and settlement exceptions, with assignment, ownership, priority, ageing, SLA, escalation and controlled resolution or reprocessing.", "pr": "Must-have", "c": "Partially Compliant", "a": "Operations teams reprocess any offer and date through the admin portal, and a queue holds refunds that need review. Exception queues for configuration, merchant and MID issues, approval backlogs, code failures and settlement, with owners, SLA tracking and escalation, are on the roadmap."}, "OM-11.3": {"p": "OMS", "s": "OM-11 — Offer Operations & Lifecycle Management", "sub": "Readiness & Launch", "r": "Provide a formal pre-launch readiness checklist and dashboard with named launch owner, outstanding dependencies, cross-functional sign-offs, go/no-go decision and cutover approval evidence.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each launch has a named owner and a readiness checklist covering outstanding dependencies and sign-offs. The bank’s “Accept & Sign-off” acts as the formal go/no-go decision and is recorded with a unique reference code as cutover evidence."}, "OM-11.6": {"p": "OMS", "s": "OM-11 — Offer Operations & Lifecycle Management", "sub": "Live Operations & Change", "r": "Provide a controlled live-offer and campaign change-request workflow for advertiser-, merchant-, issuer- or operator-initiated changes, including impact assessment, approvals, effective dating, validation, rollback and stakeholder/customer notification triggers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Changes to live offers, whether raised by a merchant, issuer or operator, go through a controlled change request with impact assessment, approval and an effective date. Each change is validated before it applies, can be rolled back, and triggers notifications to stakeholders and customers where needed."}, "OM-11.7": {"p": "OMS", "s": "OM-11 — Offer Operations & Lifecycle Management", "sub": "Live Operations & Change", "r": "Provide emergency pause and partial-suspension controls by programme, market, merchant, MID/store, audience, catalogue or channel, with authorised approval, stakeholder notifications, reason codes, recovery validation and controlled resume.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations can suspend all activity for a bank at once. Pause by programme, market, merchant, store, audience or channel, with reason codes, stakeholder notification and controlled resume, is on the roadmap."}, "OM-2.1": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Publish approved offers from a common offer pool to multiple issuer websites, mobile apps and authorised portals, with independently configurable offer sets and categories per portal.", "pr": "Must-have", "c": "Fully Compliant", "a": "Approved offers are sent from the central offer pool to each issuer tenant and delivered to their websites, mobile apps and portals through the offer feed API/SDK. Each tenant or portal has its own configurable set of offers and categories."}, "OM-2.2": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Distribute offers through email, SMS and push-notification platforms using configurable communication templates, without requiring the OMS to be the system of record for customer contact data.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers can be distributed through the issuer's own messaging platofrm.  The platform passes offer content and the eligible customer IDs to the issuer. Customer contact data stays with the issuer, the OMS holds only tokenised customer IDs, not contact details."}, "OM-2.5": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Provide APIs to retrieve offer details, eligibility, availability, locations, terms and redemption instructions.", "pr": "Must-have", "c": "Fully Compliant", "a": "The customer offer API returns each customer’s eligible offers. Each offer’s details include cashback value, validity, merchant/brand, terms and conditions, and step-by-step cashback instructions."}, "OM-2.6": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Support incremental/delta feeds, pagination, filtering and webhooks or events for offer create, update, pause and expiry changes.", "pr": "Must-have", "c": "Fully Compliant", "a": "The offer API supports pagination and filtering. Delta feeds of changes since a given timestamp can be obtained through API query params and webhook events are sent for offer create, update or expiry changes."}, "OM-2.7": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Ensure withdrawn, paused or exhausted offers are removed or marked unavailable across connected channels within a configurable SLA.", "pr": "Must-have", "c": "Fully Compliant", "a": "The offer feed only ever returns offers whose status is live, and it reads that status on every request. An offer that is withdrawn, paused, exhausted or completed disappears from all connected channels as soon as its status changes. The cache refresh interval is configurable for tenants that need a specific SLA."}, "OM-2.8": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Maintain consistent offer identifiers and lifecycle status across every distribution channel.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer keeps the same offer ID from authoring through dispatch, the customer API and cashback records. Lifecycle status is held centrally and synced from the OMS to the distribution layer, so every channel sees the same status."}, "OM-3.1": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Support both merchant self-registration and operator-assisted onboarding, capturing legal name, trading name, description, country, currency, address, contacts, account users, logo and required documentation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune operators can onboard merchants from the admin portal, capturing merchant legal and trading names, logo, region and account users. Merchants can also self-register and create their brand through the merchant portal."}, "OM-3.10": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Portal & Stores", "r": "Support merchant user administration, delegated access and segregation between merchant organisations.", "pr": "Must-have", "c": "Fully Compliant", "a": "Operators manage merchant portal users from Admin portal. Merchant admins can view and manage their own team’s users. Every API request is checked against the logged-in user’s merchant."}, "OM-3.2": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Support merchant due-diligence, sanctions/compliance checkpoints and document-expiry tracking appropriate to the operating market.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune’s operations team runs due-diligence and sanctions/compliance screening manually in Pulse Admin before a merchant is activated. Merchants can be suspended or reactivated from the admin portal if their compliance status changes. Document expiery tracking is planned in the roadmap."}, "OM-3.3": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Allow Mastercard or an authorised operator to approve, reject, suspend and reactivate merchants with reason codes and audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Authorised operators can approve or reject merchant onboarding, and can suspend and reactivate merchants from Pulse Admin. Each action is recorded in the audit history."}, "OM-3.4": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Support bulk merchant and store onboarding through validated file upload or APIs.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchants, brands and stores (MIDs/TIDs) can be onboarded in bulk through the API"}, "OM-3.5": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Maintain a unique merchant identity and detect potential duplicate merchant, brand, store and contact records.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each brand maps to one global brand ID and can belong to only one merchant. Each merchant ID is unique across the platform, terminal IDs are unique within a merchant and merchant user emails are also unique."}, "OM-3.6": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Portal & Stores", "r": "Maintain merchant group, brand, legal entity, online channel, branch and store hierarchies, including store name, address, contact details, opening hours, website/social links and geography.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchants are modelled as a hierarchy- merchant (legal entity) > brands > merchant IDs > terminals/stores, with each store tagged as in-store or online. Brands hold website and social links a category and a sub-category. Stores hold a name, address, contact details, opening hours and location."}, "OM-3.8": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Portal & Stores", "r": "Provide a secure, role-based merchant portal for profile and store maintenance, offer creation, code management, redemption validation, reporting and issue management.", "pr": "Must-have", "c": "Fully Compliant", "a": "The merchant portal is secured with OTP-based login and role-based access, and each merchant’s data is kept separate from other merchants. Merchants can maintain their profile, brands and stores, create and track campaign requests, and view performance reports. Redemption is validated automatically against card transactions, and merchants can raise and track issues from the portal."}, "OM-4.1": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Support configurable redemption and validation methods by offer, including customer or merchant validation, promotional code, QR code, barcode, merchant-entered code, customer-presented voucher and API/POS validation.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each offer sets its validation method. Card-linked offers validate automatically from the card transaction. Promo-code offers show the code and a tracked link in the bank app, the merchant’s checkout validates the code, and the affiliate network reports the purchase to Lune"}, "OM-4.10": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Validation, Codes & Controls", "r": "Support platform-generated, merchant-uploaded and static promotional codes; single-use and multi-use codes; code pools; controlled allocation; quantity setup; and secure masking.", "pr": "Must-have", "c": "Fully Compliant", "a": "Promo-code offers use the codes that the merchant provides through our affiliate network partner: one static code for the offer or single-use codes. Lune receives each code with its validity dates, usage rules and quantity, shows it in the bank app."}, "OM-4.11": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Validation, Codes & Controls", "r": "Track voucher/code inventory, reservation, issuance, redemption, expiry and remaining availability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune reads code availability, validity and expiry from the affiliate network feed, and records each purchase the network reports against its offer. When a code expires or runs out, Lune stops showing it."}, "OM-4.12": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Validation, Codes & Controls", "r": "Provide exception queues and controlled reprocessing for failed, timed-out or disputed redemptions.", "pr": "Must-have", "c": "Fully Compliant", "a": "A failed matching run is retried automatically, and operators can reprocess any offer and date on demand. Reprocessing is safe because each transaction can earn cashback only once."}, "OM-4.13": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Validation, Codes & Controls", "r": "Notify authorised users when redemption, inventory or fraud thresholds are breached.", "pr": "Must-have", "c": "Fully Compliant", "a": "Budget usage and cashback activity for each offer are visible in real time in the admin and merchant portals. Lune's team receives automatic alerts when a control fails, and informs the bank.", "triage": "now"}, "OM-4.2": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Validate offer status, validity, customer and store eligibility, usage limits and inventory in real time through the platform or POS/API, and return the applicable offer value and decision.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each qualifying transaction is checked against the offer’s status, validity dates, customer eligibility and activation, participating stores (MIDs) and remaining budget, and the cashback value is calculated. Matching runs as a scheduled batch over each day’s card transactions, not in real time at the POS."}, "OM-4.3": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Support merchant-side authentication using store PIN, role-based login or equivalent secure controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchant users sign in to the portal with email, password and a OTP and access depends on their role. Card-linked redemption needs no authentication at the store, because qualifying transactions are matched automatically."}, "OM-4.4": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Generate a unique redemption reference and return a clear approved, declined or pending outcome with reason code.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each qualifying transaction creates a cashback record with a unique reference, linked to the original card transaction ID and the offer. The record moves through clear outcomes and declines carry a reason code."}, "OM-4.5": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Prevent duplicate, replayed, expired, cancelled or otherwise invalid redemptions using idempotent controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each card transaction can earn cashback only once."}, "OM-4.6": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Support reversal, cancellation and controlled manual adjustment of a redemption with approval and audit trail.", "pr": "Must-have", "c": "Fully Compliant", "a": "Cashback is held for a configurable refund window before it is paid, and if the purchase is refunded during that window the cashback is reversed. Each change is approved and recorded in the audit trail."}, "OM-4.7": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Support online and in-store redemption across multiple configured geographies and currencies, with market-specific rules.", "pr": "Must-have", "c": "Fully Compliant", "a": "Both online and in-store transactions are matched, with stores tagged by channel (in-store or online). The platform runs in several regions and every offer, transaction and cashback carries its own currency. Market-specific rules are configured per offer from the Admin portal."}, "OM-4.8": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Redemption Journeys", "r": "Support configurable guest redemption from an offer page without mandatory customer account creation or login, subject to issuer-approved fraud and eligibility controls.", "pr": "Nice-to-have", "c": "Fully Compliant", "a": "Offers can be set up so that every eligible cardholder qualifies automatically, with no activation, account creation or login. Cashback is then applied to any qualifying card transaction at participating stores."}, "OM-4.9": {"p": "OMS", "s": "OM-4 — Redemption & Validation", "sub": "Validation, Codes & Controls", "r": "Apply configurable velocity, usage, device, merchant, store and code-level fraud rules and flag suspicious redemption behaviour.", "pr": "Must-have", "c": "Partially Compliant", "a": "Hold window & tools from partners to do it"}, "OM-5.1": {"p": "OMS", "s": "OM-5 — Targeting Configuration", "sub": "Targeting Criteria & Controls", "r": "Ingest issuer-approved customer segments and attributes without requiring raw payment-card data in the OMS.", "pr": "Must-have", "c": "Fully Compliant", "a": "Customer data comes from the issuer's enriched transaction and customer feeds, identified only by tokenised IDs from the issuer, with no raw card numbers stored. Segments are built from that data with targeting rules and can be narrowed by the card programmes the issuer selects."}, "OM-5.2": {"p": "OMS", "s": "OM-5 — Targeting Configuration", "sub": "Targeting Criteria & Controls", "r": "Support rules-based targeting using customer segment, location, language, channel, behaviour, preference and engagement attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Targeting rules are written against the customer's enriched transaction history and can combine spending behaviour, transaction channel and location, and card programme."}, "OM-5.3": {"p": "OMS", "s": "OM-5 — Targeting Configuration", "sub": "Targeting Criteria & Controls", "r": "Allow configurable business rules, exclusions, prioritisation and suppression to override automated recommendations.", "pr": "Must-have", "c": "Fully Compliant", "a": "Operators set the audience for each offer with targeting rules that support exclusions and suppression."}, "OM-6.8": {"p": "OMS", "s": "OM-6 — Offer Discovery & Experience Delivery", "sub": "Catalogue Experience & Engagement", "r": "Capture consented engagement events including impression, view, click, favourite, share, code reveal and redemption initiation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offer views, activations, impressions, clicks, favourites and shares are captured for each customer within the issuer’s consent framework. Code reveals are captured for promo-code offers."}, "OM-7.1": {"p": "OMS", "s": "OM-7 — Analytics & Reporting", "sub": "Dashboards, Reports & Data", "r": "Provide real-time or near-real-time dashboards for offer inventory, publication status, reach, engagement, validation, redemption, merchant performance and ROI indicators.", "pr": "Must-have", "c": "Fully Compliant", "a": "Real-time dashboards in the admin, bank and merchant portals show offer status, audience reach, views, activations, cashback earned, budget used and merchant performance. ROI indicators include incremental spend and cost per acquisition."}, "OM-8.1": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Provide managed merchant acquisition and offer-sourcing services for merchant-funded discounts, benefits and promotional codes in agreed markets and categories.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune's business team actively approaches merchants in agreed markets and categories, guided by transaction data, and assists onboarding and offer creation. All sourced offers are merchant-funded."}, "OM-8.10": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Train participating merchants and relevant store staff before launch and maintain evidence of completion.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchant users are trained on the merchant portal (campaign requests, reporting and support) before launch, and completion is recorded during onboarding. Store staff need no training, because cashback is applied automatically from card transactions with no action at checkout."}, "OM-8.12": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Operate a process to resolve merchant non-honouring, invalid codes, incorrect terms, unavailable inventory and customer complaints within agreed SLAs.", "pr": "Must-have", "c": "Fully Compliant", "a": ""}, "OM-8.15": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Disclose use of subcontractors, aggregators or third-party content sources and remain accountable for offer validity and service delivery.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune sources directly and through disclosed sourcing partners and affiliate networks. Lune stays accountable."}, "OM-8.16": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Support merchant relationship management and renewal of offers, codes and commercial agreements before expiry.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers are reviewed before they expire and renewed or renegotiated with the merchant. Code renewal is coordinated with the merchant or the network partner before expiry."}, "OM-8.2": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Maintain a transparent sourcing pipeline showing prospective merchants, outreach status, commercial negotiation, contracting, content readiness and planned launch date.", "pr": "Must-have", "c": "Fully Compliant", "a": "The sourcing pipeline tracks each merchant from prospect through outreach, negotiation, contracting and content readiness to launch."}, "OM-8.3": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Source offers against Mastercard-defined market, category, brand, geographic, customer and campaign briefs.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers cann be sourced against briefs from Mastercard that set the market, category, brand, geography, customer segment and campaign. Transaction data is used to find which merchants match each brief best."}, "OM-8.4": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Demonstrate an existing merchant ecosystem and the ability to expand coverage without representing uncontracted merchants as available inventory.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune already has a merchant network across its live markets and adds merchants through active sourcing. Only merchants that are contracted and onboarded can publish offers."}, "OM-8.5": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Define and report minimum offer-quality standards, including customer value, exclusivity where agreed, validity, geographic coverage and redemption simplicity.", "pr": "Must-have", "c": "Fully Compliant", "a": "Both Lune’s internal review and the bank’s review check offers against set standards and quality is reported for each campaign."}, "OM-8.6": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Identify whether each sourced offer is exclusive, semi-exclusive or publicly available and disclose material channel restrictions.", "pr": "Must-have", "c":
