<style>/* Shared Lune UI prototype layer (shell, sidebar, buttons, badges, tabs, fields, tables, cards, sheet, toast). Built from bank-reporting-suite. */

/* Prototype layer on top of Lune UI. Layout: UiAppSidebar (280px) + content on --muted. Every colour, size and radius comes from Lune UI tokens. Light only. */
:root { color-scheme: light; }
html, body { background: var(--muted); color: var(--foreground); }
body { font-family: var(--font-sans); font-size: .875rem; line-height: 1.3125rem; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 100vh; }

/* App sidebar (UiAppSidebar, captured markup classes reproduced) */
.sb { background: var(--sidebar); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.sb-head { border-bottom: 1px solid var(--sidebar-border); padding: 1.5rem 1.75rem .75rem; display: flex; flex-direction: column; gap: .25rem; }
.sb-head img, .sb-head svg { height: 1.75rem; width: auto; }
.env { margin-left: 2.25rem; display: inline-flex; width: fit-content; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); padding: 1px .375rem; font-size: .625rem; line-height: .875rem; font-weight: 600; }
.sb-body { flex: 1; overflow-y: auto; padding: .5rem; display: flex; flex-direction: column; gap: .25rem; }
.sb-item { display: flex; align-items: center; gap: .5rem; width: 100%; border: 0; border-radius: calc(var(--radius) - 2px); padding: .75rem; background: var(--sidebar); color: var(--foreground); font: inherit; font-size: .875rem; line-height: 1.25rem; font-weight: 500; text-align: left; cursor: pointer; transition: background-color .15s; }
.sb-item:hover { background: var(--muted); }
.sb-item svg { width: 1.25rem; height: 1.25rem; flex: none; color: var(--muted-foreground); }
.sb-item .chev { margin-left: auto; width: 1rem; height: 1rem; }
.sb-sub { display: flex; flex-direction: column; gap: .25rem; padding-left: 1.75rem; }
.sb-subitem { display: flex; align-items: center; gap: .5rem; border: 0; border-radius: calc(var(--radius) - 2px); padding: .5rem .75rem; background: var(--sidebar); color: var(--sidebar-foreground); font: inherit; font-size: .875rem; line-height: 1.25rem; font-weight: 500; text-align: left; cursor: pointer; }
.sb-subitem:hover { background: var(--muted); }
.sb-subitem[aria-current="page"] { background: var(--color-gray-300); color: var(--primary); }
.sb-subitem span:first-child { flex: 1; min-width: 0; }
.tag { font-size: .625rem; line-height: .875rem; font-weight: 600; color: var(--muted-foreground); }
.sb-item:focus-visible, .sb-subitem:focus-visible, .um:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.proto { margin: .5rem; border: 1px dashed var(--input-border-hover); border-radius: var(--radius); padding: .75rem; display: flex; flex-direction: column; gap: .5rem; background: var(--card); }
.proto b { font-size: .75rem; }
.proto p { font-size: .75rem; line-height: 1rem; color: var(--muted-foreground); }
.um { border: 0; border-top: 1px solid var(--sidebar-border); background: transparent; display: flex; align-items: center; gap: .5rem; padding: 1.25rem 1rem; text-align: left; font: inherit; cursor: pointer; width: 100%; }
.um:hover { background: var(--muted); }
.av { width: 2rem; height: 2rem; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-size: .75rem; font-weight: 600; flex: none; }
.um b { display: block; font-size: .875rem; line-height: 1.25rem; font-weight: 500; }
.um small { display: block; font-size: .75rem; line-height: 1rem; color: var(--muted-foreground); }

/* Page */
.main { min-width: 0; display: flex; flex-direction: column; }
.ph { background: var(--background); border-bottom: 1px solid var(--border); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: .75rem; }
.ph-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.ph-left { display: flex; gap: .75rem; align-items: flex-start; }
.crumb { font-size: .75rem; line-height: 1rem; color: var(--muted-foreground); margin-bottom: .125rem; }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted-foreground); font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.title { font-size: 1.5rem; line-height: 1.75rem; font-weight: 700; }
.desc { font-size: .875rem; color: var(--muted-foreground); max-width: 72ch; margin-top: .25rem; }

ences for portfolio management, reporting, search and downstream integrations.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each campaign has a name, a reference code and a merchant goal. Custom tags are on the roadmap."}, "CL-11.9": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support audience sizing / eligibility estimation before launch where the required customer and transaction data is available.", "pr": "Nice-to-have", "c": "Fully Compliant", "a": "Lune operations tests the audience rule before launch and sees the number of eligible customers and sample records. The bank sees the audience size when it reviews the campaign."}, "CL-13.1": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Support onboarding and maintenance of merchants, brands, outlets, MIDs and terminal identifiers individually and in bulk through UI, file and/or API.", "pr": "Must-have", "c": "Partially Compliant", "a": "Merchants and Lune operations add brands, MIDs and terminals through the portals and the API. Bulk onboarding by file is on the roadmap."}, "CL-13.10": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Monitoring & Exceptions", "r": "Provide alerts and monitoring for merchant/MID mapping failures, sudden drops in transaction activity and other anomalies that may impact reward qualification.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations monitors cashback runs and rejection reasons, such as MID mismatch. Merchant-level anomaly alerts are on the roadmap."}, "CL-13.11": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Readiness & Certification", "r": "Provide a formal merchant-readiness and certification workflow before campaign launch, including merchant/MID/acquirer validation, test-transaction evidence where feasible, redemption and servicing readiness, required training, merchant sign-off, outstanding dependencies and readiness status.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations reviews the merchant, MIDs and terminals of each campaign before the bank sees it. A formal readiness workflow with test-transaction evidence and merchant sign-off is on the roadmap."}, "CL-13.2": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Provide MID validation and activation tooling with clear statuses including active, pending, invalid, duplicate, not found and deactivated.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse rejects duplicate MIDs and terminal IDs and locks MIDs that a live campaign uses. MID statuses such as pending, invalid, not found and deactivated are on the roadmap."}, "CL-13.3": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Detect missing, invalid, duplicate or conflicting merchant/MID mappings and surface actionable exceptions before campaign launch.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse rejects duplicate MIDs and terminal IDs. A campaign cannot be submitted without at least one MID, and Lune operations checks the mappings in review."}, "CL-13.4": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Provide configurable SLAs/status tracking for merchant/MID onboarding, validation and issue resolution.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse records the status and time of each campaign stage. SLA tracking for merchant and MID onboarding is on the roadmap."}, "CL-14.10": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Invoicing & Reconciliation", "r": "Provide full auditability from invoice/settlement amount back to campaign, merchant, qualifying transaction, reward event and adjustment history.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each cashback amount traces back to its campaign, merchant, transaction and reversals. The link from invoices comes with the invoicing in CL-14.6."}, "CL-14.11": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Budget Alerts & Customer Communication", "r": "Send configurable budget-consumption alerts to authorised recipients when parameterised thresholds are reached, including multiple thresholds such as 80%, 90% and 100% and the current committed, accrued, paid and remaining amounts.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations sees budget use for each campaign. Configurable alerts at thresholds such as 80%, 90% and 100% are on the roadmap."}, "CL-14.12": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Budget Alerts & Customer Communication", "r": "When a budget limit stops or pauses an offer or campaign, update offer availability across connected channels within the agreed SLA and trigger or support issuer email, push, in-app or equivalent customer notifications through configured integrations.", "pr": "Must-have", "c": "Partially Compliant", "a": "When the budget is used, Pulse closes the campaign in the nightly run and removes the offer from all channels at once. A campaign-end event that lets the bank notify customers is on the roadmap."}, "CL-14.3": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Budgets & Funding", "r": "Automatically throttle, pause or stop an offer/campaign when the applicable budget or reward cap is reached, according to configurable rules.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse stops a campaign automatically when its budget is used and removes the offer from customer channels."}, "CL-14.4": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Budgets & Funding", "r": "Support merchant-funded, issuer-funded, Mastercard-funded and co-funded campaigns, with configurable allocation or split-funding rules where required.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse supports merchant-funded campaigns. Issuer-funded, Mastercard-funded and co-funded campaigns with split rules are on the roadmap."}, "CL-14.5": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Budgets & Funding", "r": "Maintain separate financial ledgers/reconciliation views by funding party, campaign, merchant, issuer, market and currency.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each cashback entry links to its campaign, merchant, bank, market and currency, so the ledger can be split by each of them. A split by funding party comes with CL-14.4."}, "CL-14.6": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Invoicing & Reconciliation", "r": "Generate invoice-ready data linking cashback/rewards, reversals, adjustments, applicable fees and funding responsibility to the underlying campaign and merchant.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse gives cashback and reversals for each campaign and merchant. Invoice-ready data with fees and funding responsibility is on the roadmap."}, "CL-14.7": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Invoicing & Reconciliation", "r": "Support configurable fee components and tax fields in invoicing/reconciliation outputs where applicable to the commercial model.", "pr": "Must-have", "c": "Partially Compliant", "a": "Fee and tax fields in invoicing outputs are on the roadmap."}, "CL-14.8": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Invoicing & Reconciliation", "r": "Support credit-note/reversal handling and reconciliation where previously invoiced rewards are subsequently refunded, reversed or adjusted.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse records each reversal as its own entry linked to the original cashback. Credit-note handling is on the roadmap."}, "CL-14.9": {"p": "PCLO", "s": "14. Budget, Funding & Invoicing", "sub": "Invoicing & Reconciliation", "r": "Provide invoice and settlement extracts in configurable machine-readable formats and/or APIs suitable for downstream finance processes.", "pr": "Must-have", "c": "Partially Compliant", "a": "Settlement data is available through the API. Invoice extracts in configurable formats are on the roadmap."}, "CL-15.8": {"p": "PCLO", "s": "15. Platform, Deployment & Security", "sub": "Security, Privacy & Access", "r": "Support enterprise SSO, multi-factor authentication and role-based access control for administrative and operational users.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations staff sign in through company single sign-on. Bank and merchant users sign in with a password and confirm each sign-in with a one-time code sent by email. Each user has a role. Sign-on through the bank's own identity provider is on the roadmap."}, "CL-3.1": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Types & Funding", "r": "Support all four offer content types: card-linked, affiliate, domestic and cross-border.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports card-linked and affiliate offers for domestic and cross-border purchases. Pulse uses affiliate purchase records to attribute rewards on eligible affiliate purchases."}, "CL-3.10": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support merchant inclusion/exclusion lists and transaction exclusions without requiring the campaign to be recreated.", "pr": "Must-have", "c": "Partially Compliant", "a": "To change inclusion or exclusion rules in Pulse, close the original campaign and create a replacement with a new campaign ID. The replacement can reuse the original campaign assets. Transactions that already qualified stay linked to the original campaign and keep their qualification under its rules."}, "CL-3.11": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support campaign budget caps and configurable behaviour when the offer budget is exhausted or nearly exhausted.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has a budget. The merchant chooses to run the campaign for a fixed period or until the budget is used. When the budget is used, Pulse closes the campaign, stops new cashback and removes the offer from customer channels."}, "CL-3.12": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support configurable eligibility by card/product/portfolio/customer segment where the issuer supplies the required attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank selects the eligible card products for each campaign by BIN. The audience rule of each campaign selects customer segments from the bank's customer and transaction data."}, "CL-3.13": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support inclusion/exclusion and grouping by BIN/IIN or approved card range, enabling issuer/card-product targeting and differentiated reward structures where required.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank groups BINs into card programmes and selects the programmes for each campaign. A bank can give different card products different rewards by running a campaign for each product."}, "CL-3.17": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Limits, Timing & Priority", "r": "Support configurable offer stacking, mutual-exclusion and prioritisation rules when more than one offer can match the same transaction.", "pr": "Must-have", "c": "Partially Compliant", "a": "When a transaction matches more than one offer, each offer assesses it on its own terms, so offers stack."}, "CL-3.18": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Limits, Timing & Priority", "r": "Support offer versioning and effective-dated changes so amendments do not alter historical redemptions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse locks campaign terms when the bank approves the campaign. Pulse keeps a version history of each campaign sent to the bank. Later changes never recalculate cashback that Pulse already recorded."}, "CL-3.2": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Types & Funding", "r": "Support both merchant-funded and bank-funded rebates on the same platform.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports merchant-funded and bank-funded rebates on the same platform. Each offer identifies the funding party for settlement and reconciliation."}, "CL-3.21": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support the grouping of related offers under a common merchant offer, promotion or exclusivity identifier, including offers with different customer-facing names but materially equivalent benefits.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each campaign has a unique reference code and links to one merchant and brand."}, "CL-3.3": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support offer constructs applied to card-linked matching including single visit, cumulative spend, multi-visit, multi-redemption with minimum spend, and dynamic/tiered offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse awards cashback on each qualifying purchase. Each offer can set a minimum spend and a cashback cap per cardholder. A cardholder can earn cashback on more than one purchase, subject to the cap."}, "CL-3.4": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support configurable rebate calculations including fixed amount, percentage, tiered by transaction amount, and capped rewards.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse calculates cashback as a fixed amount, a percentage or a tier based on the transaction amount. Offers can cap the cashback per cardholder."}, "CL-3.5": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support configurable minimum spend, maximum eligible spend and reward rounding rules, including currency-specific decimal handling.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer sets a minimum spend and a maximum cashback per customer. Pulse rounds cashback half-up to the minor unit of the currency, for example 2 decimals for AED and SAR and 3 decimals for BHD."}, "CL-3.7": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support cashback and points/equivalent reward constructs, including fixed, percentage, tiered and capped mechanics, where required by the issuer proposition.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports cashback and points rewards. Each offer can use a fixed amount, a percentage or a tiered reward. The offer can also set a reward cap."}, "CL-3.9": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support configurable transaction-channel eligibility, including CP-only, CNP-only, e-commerce-only or all-channel offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign selects the eligible merchant terminals, and each terminal is marked in-store or online. So a campaign can be in-store only, online only or both."}, "CL-4.1": {"p": "PCLO", "s": "4. Personalisation", "sub": "Personalisation & AI", "r": "Support rule-based personalisation defined by the operator.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has an audience rule that selects the eligible customers from their transaction history and card products. Lune operations sets the rule with the merchant and the bank."}, "CL-4.4": {"p": "PCLO", "s": "4. Personalisation", "sub": "Personalisation & AI", "r": "Support personalisation using transaction recency, frequency, monetary value, merchant/category affinity and engagement signals where available.", "pr": "Must-have", "c": "Fully Compliant", "a": "Audience rules use the customer's enriched transaction history, including recency, frequency, spend, and merchant and category affinity. Offer views and activations are recorded for each customer."}, "CL-5.1": {"p": "PCLO", "s": "5. Offer Activation", "sub": "Activation Models", "r": "Support auto-activated offers (implicit — eligible on qualifying transaction).", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse offers use customer activation today. Customers can activate one offer or all offers in one step. Alternatively offers can be configured to be auto-activated."}, "CL-7.1": {"p": "PCLO", "s": "7. Rewards & Settlement", "sub": "Reward Calculation & Posting", "r": "Calculate and post rebates for qualifying transactions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse calculates cashback for each qualifying settled transaction every night. The bank receives the payable cashback for each customer and transaction and credits the customer's account."}, "CL-7.9": {"p": "PCLO", "s": "7. Rewards & Settlement", "sub": "Adjustments & Reversals", "r": "Handle reversals for chargebacks, refunds and fraud with automatic clawback of rebates.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse reverses cashback automatically when a refund arrives within the hold period. Chargebacks and fraud reversals use the same process when the bank sends them as refunds. Cashback becomes payable only after the hold period, which matches the refund window, so no recovery after payment is needed.", "triage": "now"}, "CL-9.1": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Customer Servicing & Adjustments", "r": "Provide a user lookup tool by unique customer identifier for L1 / L2 issue resolution.", "pr": "Must-have", "c": "Fully Compliant", "a": "Bank portal users can look up a customer by the bank's customer ID and see the customer's transactions and spend."}, "CL-9.10": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Operations, Access & Audit", "r": "Provide configurable alerts for failed files/APIs, processing delays, abnormal rejection rates, settlement failures and other material operational events.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations receives alerts for failed processing, delayed cashback runs and data-quality problems. Configurable alerts for bank users are on the roadmap."}, "CL-9.12": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Customer Servicing & Adjustments", "r": "Support maker-checker / four-eyes approval for sensitive manual adjustments and material configuration changes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Campaigns need approval from Lune and from the bank before they go live (CL-11.3). Manual adjustments and configuration changes need a written request from the bank before Lune's team makes them, so two parties approve each change.", "triage": "now"}, "CL-9.14": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Operations, Access & Audit", "r": "Provide role-based access control with configurable roles for issuer, Mastercard, vendor operations, support and audit users.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse has separate roles for bank users (admin and member), merchant users and Lune operations (viewer, editor and admin). A Mastercard role and an audit role are on the roadmap.", "triage": "roadmap"}, "CL-9.18": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Operational Work Queues", "r": "Provide actionable operational work queues for configuration defects, merchant/MID issues, approval backlogs, transaction/reward exceptions and settlement failures, with assignment, ownership, priority, ageing, SLA, status, escalation and controlled resolution or reprocessing.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations has a queue for refunds that need review, with a resolve action. Work queues for configuration, MID, approval, reward and settlement issues, with owners, SLAs and escalation, are on the roadmap."}, "CL-9.2": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Customer Servicing & Adjustments", "r": "Show a specific cardholder's assigned, active, redeemed and expired offers.", "pr": "Must-have", "c": "Partially Compliant", "a": "The bank portal shows each campaign with its audience, activations and cashback per customer. A single view of all offers for one customer is on the roadmap."}, "CL-9.7": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Operations, Access & Audit", "r": "Provide a records-processing view showing file status, exception logs and program-level performance.", "pr": "Must-have", "c": "Partially Compliant", "a": "The bank portal shows file processing status and campaign performance: audience, views, activations and activation rate. An exception log view is on the roadmap."}, "CL-9.8": {"p": "PCLO", "s": "9. Servicing & Operations", "sub": "Operations, Access & Audit", "r": "Support controlled transaction/file replay or reprocessing with duplicate-protection safeguards.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune operations can replay files and re-run cashback for chosen dates. Deduplication by transaction ID and one decision per transaction and offer prevent duplicates."}, "LAF-1": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Multi-issuer product model", "r": "Operate as a Mastercard-enabled platform that can be configured, implemented and supported for multiple participating retail issuers across markets.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform serves many banks from one deployment per market, and keeps each bank's data separate."}, "LAF-10": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Programme setup", "r": "Allow authorised users to create and maintain programme name, operating entity, country, base currency, logo, sender details and programme status.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune sets up each entity with its name, market, currency, logo and status, and maintains these details for the client."}, "LAF-100": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule versioning", "r": "Maintain version history, effective dates, approval record and rollback capability for rule changes.", "pr": "Must-have", "c": "Partially Compliant", "a": "Campaign terms are locked when the campaign goes to the bank. The platform records who submitted it and when the bank decided, and it logs changes to campaign records."}, "LAF-101": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Monthly product cap", "r": "Configure maximum points per customer, product or programme for a defined monthly period.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has a cashback or points cap for each customer, monthly and over the whole campaign, and a total budget."}, "LAF-102": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rounding", "r": "Configure decimal precision, rounding and treatment of fractional points and rounding residuals consistently.", "pr": "Must-have", "c": "Fully Compliant", "a": "Rounding is half-up to the currency's smallest unit, once for each entry. Refunds are apportioned so that rounding differences do not add up."}, "LAF-103": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule audit", "r": "Record creation, edit, activation, disablement, archive and approval events with user and timestamp.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform records who created, submitted and sent each campaign, and when the bank accepted or rejected it. Changes to campaign records are logged."}, "LAF-104": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Base earn configuration", "r": "Configure base earn rates by programme, issuer, product, account type, channel or transaction category.", "pr": "Must-have", "c": "Fully Compliant", "a": "Base earn rates are set for each campaign. Each campaign belongs to one issuer’s programme, and the issuer selects which card products earn in it, by BIN."}, "LAF-105": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Exclusions", "r": "Configure excluded transaction types, merchant categories, merchants, fees, cash-like activity and other non-qualifying events.", "pr": "Must-have", "c": "Fully Compliant", "a": "Only purchases at a campaign's merchant outlets, on the card products that the bank selected, can earn. Refunds never earn."}, "LAF-106": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule stacking", "r": "Define whether base, promotional, partner and tier rules may stack, replace one another or follow a maximum-benefit hierarchy.", "pr": "Must-have", "c": "Fully Compliant", "a": "Base, promotional, partner and tier rewards stack by default, so a purchase earns on every reward it qualifies for. A bank can group rewards so that one replaces the others, either the highest-priority reward or the one with the highest benefit"}, "LAF-107": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Refund and negative activity", "r": "Apply configurable treatment for refunds, chargebacks, partial refunds and negative-value activity.", "pr": "Must-have", "c": "Fully Compliant", "a": "A full or partial refund reverses a proportional part of the cashback. If a refund takes the purchase below the minimum spend, all cashback on that purchase is reversed."}, "LAF-108": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Retroactive rule evaluation", "r": "Support controlled impact assessment and authorised recalculation when a rule correction must apply to historical activity.", "pr": "Must-have", "c": "Partially Compliant", "a": "The platform never changes a decided purchase. Lune's team corrects an error with a new correcting entry, so the full history stays."}, "LAF-109": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule impact analysis", "r": "Estimate affected customers, transactions, points and liability before activating or changing a rule.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Lune's team sees the audience number of targeted customers based on rules, before activiating a campaign."}, "LAF-11": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Programme configuration", "r": "Allow modules and programme capabilities to be enabled or disabled through configuration without code changes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune turns modules on or off for each programme by configuration, for example cashback offers. No code change is needed."}, "LAF-110": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Immutable ledger", "r": "Maintain a complete, auditable customer points ledger with source transaction references and running balance.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each customer has a complete points ledger. Every entry is permanent, references its source transaction, and updates the customer’s running balance. A correction is a new entry, so the ledger stays auditable."}, "LAF-111": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Balance components", "r": "Calculate available balance from accrued, redeemed, expired, reversed, cancelled, adjusted and pending points.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform calculates each customer’s available balance from points earned, redeemed, expired, reversed, cancelled and adjusted. Pending points show separately until the merchant’s refund window ends."}, "LAF-112": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Point definition", "r": "Configure the programme point name, base currency, earn valuation and redemption valuation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Programme point name, earn and redemption valuation is configurable"}, "LAF-113": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Expiry policy", "r": "Configure point validity in months or periods and calculate expiry at transaction-lot level.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each programme sets point validity as a number of months from the earn date. The platform gives each point lot its own expiry date when the points are earned"}, "LAF-114": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Expiry processing", "r": "Run scheduled expiry processing and record expired point lots in the ledger and reports.", "pr": "Must-have", "c": "Fully Compliant", "a": "A scheduled job expires lots after their expiry date."}, "LAF-115": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Expiry visibility", "r": "Provide current and projected expiry schedules at customer and programme level.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform shows current and projected expiry schedules for each customer and for each programme."}, "LAF-116": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "FIFO consumption", "r": "Consume point lots using a configurable order such as earliest-expiry-first and disclose the applied method.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each programme sets the order in which point lots are used, such as earliest-expiry-first. Each redemption records the method applied and the lots it used."}, "LAF-117": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Accrual reversal", "r": "Reverse an accrual using the original transaction identifier and adjust the relevant point lot and balance.", "pr": "Must-have", "c": "Fully Compliant", "a": "A refund carries the original purchase’s transaction ID and reverses the cashback or points on that purchase, adjusting the point lot and balance."}, "LAF-118": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Redemption reversal", "r": "Reverse or cancel a redemption using the original transaction identifier, with controlled restoration of points and expiry.", "pr": "Must-have", "c": "Fully Compliant", "a": "A redemption can be reversed or cancelled using its original transaction identifier. The points are restored with their original expiry dates."}, "LAF-119": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Partial reversal", "r": "Support partial reversal where permitted and prevent reversal beyond the original eligible amount or points.", "pr": "Must-have", "c": "Fully Compliant", "a": "Partial refunds reverse a proportional part of the cashback. A reversal never takes more than the cashback that is left."}, "LAF-12": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Branding", "r": "Support programme-specific branding for administration, customer communications and customer-facing components.", "pr": "Must-have", "c": "Fully Compliant", "a": "The programmes name and logo appear on each campaign offer. Offers are shown in the bank's own app through our SDK, so customers see the correct branding."}, "LAF-120": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Pending points", "r": "Support pending, approved, rejected and released point states where transactions require validation or anomaly review.", "pr": "Must-have", "c": "Fully Compliant", "a": "Cashback or points stay pending until the merchant’s refund window ends, then they are released automatically. Transactions held for review are approved and released, or rejected."}, "LAF-121": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Bonus points", "r": "Post and report bonus points separately from base or spend-earned points.", "pr": "Must-have", "c": "Fully Compliant", "a": "Bonus points are posted and reported separately from base points earned on spend."}, "LAF-122": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Point purchase", "r": "Support controlled point purchase where enabled, including rate, payment reference, caps, tax treatment and ledger posting.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Point purchase is on the product roadmap.", "triage": "roadmap"}, "LAF-123": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Point transfer", "r": "Support controlled transfer to external loyalty or airline programmes where enabled, with partner reference and status tracking.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Transfer of points to external loyalty and airline programmes is on the product roadmap.", "triage": "roadmap"}, "LAF-124": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Liability", "r": "Calculate outstanding point liability using configurable valuation rules and reconcile it to customer balances.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform calculates outstanding cashback and points liability from the ledger, using each programme’s point valuation, and reconciles it to customer balances."}, "LAF-125": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Statements", "r": "Generate customer statements showing opening balance, activity, expiry and closing balance for a defined period.", "pr": "Must-have", "c": "Partially Compliant", "a": "The bank portal shows each customer's cashback for each campaign."}, "LAF-126": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Negative-balance policy", "r": "Support configurable negative-balance, recovery and future-earn offset treatment following reversals or corrections.", "pr": "Must-have", "c": "Fully Compliant", "a": "Reversals never take a purchase's cashback below zero, so negative balances do not occur."}, "LAF-127": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Balance buckets", "r": "Maintain separate balance buckets by programme, funding source, point type, earn source, validity or redemption restriction.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each customer has one points balance in their bank’s programme. Every ledger entry records its campaign, funding party, earn source and expiry date, and whether it is pending or available to redeem. The balance can be split by any of these."}, "LAF-128": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Pooling and sharing", "r": "Support controlled pooling, gifting or transfer of points between eligible customer accounts, including fees and limits.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Pooling, gifting and transfer of points between customer accounts is on the product roadmap.", "triage": "roadmap"}, "LAF-129": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Breakage analytics", "r": "Report actual and forecast point expiry or breakage using configurable methodology and clearly stated assumptions.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune reports expired points and forecasts future expiry. The bank chooses how the forecast is calculated, and each report states the assumptions it used."}, "LAF-13": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Currency", "r": "Support market currencies and clearly identify the currency used for transaction values, point valuation and reporting.", "pr": "Must-have", "c": "Fully Compliant", "a": "Every transaction and every cashback amount carries its currency. Each campaign uses the market currency where the programme was deployed, and these values are used for point valuation and reporting."}, "LAF-130": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Loyalty Value Ledger", "sub": "Financial valuation", "r": "Maintain effective-dated point cost and liability valuation rates by programme, currency or funding source.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each programme keeps effective-dated point cost and liability valuation rates, by currency and by funding source."}, "LAF-131": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier framework", "r": "Enable or disable tiering per programme and maintain an ordered set of programme tiers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Tiering is turned on or off for each programme. The programme keeps an ordered set of tiers."}, "LAF-132": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Base tier", "r": "Define a default base tier assigned when no higher-tier condition is met.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each programme has a base tier. A customer is in the base tier when no higher tier condition is met."}, "LAF-133": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier attributes", "r": "Configure tier name, icon, multiplier, milestone, bonus and effective period.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each tier has a name, icon, multiplier, milestone, bonus and effective period."}, "LAF-134": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Progression basis", "r": "Support lifetime, calendar-period and rolling-period tier qualification.", "pr": "Must-have", "c": "Fully Compliant", "a": "Tiers qualify over a rolling period, such as the last 12 months, assessed each month. Each programme can also use a calendar period or lifetime qualification."}, "LAF-135": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Points qualification", "r": "Qualify tier progression using accrued points or other configured eligible point measures.", "pr": "Must-have", "c": "Fully Compliant", "a": "Tier progression can use points earned, or a selected type of points, such as points from card spend only."}, "LAF-136": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Aggregate qualification", "r": "Qualify tiers using count, sum, minimum, maximum or average of configured transaction attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Tiers can qualify on the count, sum, minimum, maximum or average of transaction values, such as total spend or number of purchases."}, "LAF-137": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Multiple criteria", "r": "Support OR logic across qualifying criteria and assign the highest tier whose conditions are met.", "pr": "Must-have", "c": "Fully Compliant", "a": "A tier can have more than one qualifying criterion, such as spend, points or card product, with OR logic. The customer gets the highest tier whose conditions are met."}, "LAF-138": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier scheduler", "r": "Evaluate tier movement on a scheduled and on-demand basis.", "pr": "Must-have", "c": "Fully Compliant", "a": "Tier movement is evaluated on a schedule, such as monthly, and on demand."}, "LAF-139": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier movement", "r": "Process upgrade, downgrade and renewal with effective dates, customer notification and audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Upgrades, downgrades and renewals apply from an effective date. Each move is kept in the tier history and sends an event to the bank to notify the customer."}, "LAF-14": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Localisation", "r": "Support programme-specific language, date, number and time-zone settings.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each market has its own business time zone and cashback dates use it. Merchant brand names support English and Arabic."}, "LAF-140": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier change control", "r": "Route tier configuration changes through maker-checker approval.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team changes tier configuration on the bank’s written request, so two parties approve each change."}, "LAF-141": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Tier reporting", "r": "Report tier population, movement, qualification metrics and related points impact.", "pr": "Must-have", "c": "Partially Compliant", "a": "Reports can be filtered and split by tier, which shows the tier population and the points impact of each tier. Tier movement and qualification metrics reports are on the product roadmap.", "triage": "roadmap"}, "LAF-142": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Qualification and requalification", "r": "Configure separate upgrade, renewal, downgrade and requalification thresholds and assessment periods.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team sets separate thresholds and assessment periods for upgrade, renewal, downgrade and requalification for each programme, as the bank agrees."}, "LAF-143": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Grace and soft landing", "r": "Support grace periods, soft landing and controlled downgrade by one or more levels.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Grace periods, soft landing and controlled downgrade by one or more levels are on the product roadmap.", "triage": "roadmap"}, "LAF-144": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Status & Tier Management", "sub": "Manual tier servicing", "r": "Allow authorised, reason-coded and time-bound manual tier assignment through approval workflow.", "pr": "Must-have", "c": "Partially Compliant", "a": "On the Roadmap: Lune’s team sets a customer’s tier with a reason code and an end date, through approval. At the end date, the normal tier rules apply again.", "triage": "roadmap"}, "LAF-145": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Segment criteria", "r": "Create segments using demographics, enrolment, balance, tier, status, transaction history, behaviour and custom attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team creates segments for the bank from transaction history, behaviour, balance, tier and the customer attributes that Lune builds from transactions."}, "LAF-146": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Segment logic", "r": "Support multiple criteria, inclusion/exclusion logic and configurable date windows.", "pr": "Must-have", "c": "Fully Compliant", "a": "Audience definitions combine many criteria, include and exclude customers, and use date windows."}, "LAF-147": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Segment refresh", "r": "Refresh segment membership on a configurable schedule and show last successful refresh.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune’s team builds each campaign’s audience at launch and fixes it, so every campaign result is auditable. On the bank’s request, Lune’s team refreshes an audience for a new campaign, and records the date of each build."}, "LAF-148": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Segment governance", "r": "Prevent deletion of a segment used by an active campaign and retain change history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign keeps its own fixed audience, and nobody can change it after go-live."}, "LAF-149": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign setup", "r": "Create bonus-point campaigns with name, objective, target segment, validity, status and point award.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bonus campaign has a name, objective, target segment, validity dates, status and an award in cashback or points. Lune’s team sets the target segment, and the bank accepts or rejects the campaign before it goes live"}, "LAF-15": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Configuration portability", "r": "Support controlled export and import of compatible configuration between programmes and environments, with validation and audit history.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Lune's team sets up and maintains the configuration for each bank, merchant/entity and each environment."}, "LAF-150": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Multi-segment targeting", "r": "Target multiple included and excluded segments within a campaign.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune's team can include and exclude groups of customers in one audience definition."}, "LAF-151": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign audience", "r": "Target existing customers, newly enrolled customers or both.", "pr": "Must-have", "c": "Partially Compliant", "a": "A campaign targets the customers in its audience at go-live."}, "LAF-152": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Award frequency", "r": "Configure whether an eligible customer receives a campaign award once or according to a controlled frequency.", "pr": "Must-have", "c": "Fully Compliant", "a": "Every qualifying purchase earns, up to the customer's cap for the campaign."}, "LAF-153": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign lifecycle", "r": "Support draft, approval, scheduled, active, paused, completed and reactivated campaign states.", "pr": "Must-have", "c": "Fully Compliant", "a": "Campaigns go through draft, review, bank approval, scheduled, live and completed. A campaign also closes automatically when its budget is used up."}, "LAF-154": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Concurrent campaigns", "r": "Support multiple simultaneous campaigns with defined precedence and duplicate-award controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Many campaigns run at the same time. One purchase earns once in each campaign that it qualifies for."}, "LAF-155": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign approval", "r": "Route campaign creation and material changes through maker-checker approval.", "pr": "Must-have", "c": "Fully Compliant", "a": "Three parties approve each campaign: the merchant submits it, Lune's team reviews it, and the bank accepts it or rejects it with a reason. Terms cannot change after the campaign goes to the bank."}, "LAF-156": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign analytics", "r": "Report target reach, eligible customers, issued points, credited customers, failures and campaign cost.", "pr": "Must-have", "c": "Partially Compliant", "a": "The bank portal shows campaign counts and the cashback log. Merchant reporting will show targeted customers, activations, rewarded customers, the reasons why purchases did not qualify, and cashback cost."}, "LAF-157": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Campaign communications", "r": "Associate approved email and SMS templates with campaign events.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Lune prepares the email and SMS messages for each campaign event. The bank’s systems send them."}, "LAF-158": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Control groups", "r": "Support holdout or control groups to measure incremental campaign impact.", "pr": "Nice-to-have", "c": "Partially Compliant", "a": "Holdout and control groups are on the product roadmap.", "triage": "roadmap"}, "LAF-159": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Budget control", "r": "Configure campaign point budgets, customer caps and automatic pause or alert thresholds.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has a budget and a cap for each customer. When the next cashback does not fit in the budget, the campaign closes automatically and leaves the bank's app."}, "LAF-16": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Data segregation", "r": "Prevent cross-programme access or processing unless explicitly authorised and fully audited.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bank's users see only the offers which the bank has accepted. Only authorised Lune operations staff can see all offers which are available."}, "LAF-160": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer Targeting & Bonus Campaigns", "sub": "Eligibility at event time", "r": "Revalidate segment and campaign eligibility when the qualifying event is processed.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform checks each purchase when it is processed: the campaign was live on that date, the customer was in the audience and had activated the offer, and the card was eligible."}, "LAF-161": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Accrual thresholds", "r": "Flag accruals using configurable point, transaction-count, calendar-period and product thresholds.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team sets thresholds for each programme by points, transaction count, calendar period and card product. Accruals above a threshold are flagged for review."}, "LAF-162": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Redemption thresholds", "r": "Flag redemptions using configurable point, transaction-count, calendar-period and product thresholds.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team controls redemption limits for each programme. A redemption can never be more than the customer’s available balance."}, "LAF-163": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Review queue", "r": "Provide a queue of flagged customers and transactions with relevant history, rule outcome and risk reason.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team reviews exceptions for the bank, using the history and the recorded reason for each transaction."}, "LAF-164": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Decisioning", "r": "Allow authorised users to approve, reject or release flagged activity with mandatory comments.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team approves, rejects or corrects flagged activity on the bank’s request, and records the reason."}, "LAF-165": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Processing action", "r": "Configure whether flagged activity is blocked, held as pending or allowed with an alert.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team controls whether activity is blocked, held or allowed, through each campaign’s limits and the hold until the refund window ends."}, "LAF-166": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Alerts", "r": "Notify authorised users when thresholds are breached or reviews exceed agreed ageing.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team receives automatic alerts when a control fails, and informs the bank."}, "LAF-167": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Risk & Exception Management", "sub": "Anomaly audit", "r": "Retain thresholds, flags, decisions, comments and resulting ledger actions for audit.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps a full record of each cashback decision and each ledger entry."}, "LAF-168": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Standard reports", "r": "Provide standard customer, transaction, communication, liability, expiry, administration and processing-log reports.", "pr": "Must-have", "c": "Partially Compliant", "a": "The bank portal shows campaign lists, campaign counts and the cashback log for each campaign."}, "LAF-169": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Transaction report", "r": "Report transaction ID, type, amount, currency, customer, product, points, dates, source reference, status and audit fields.", "pr": "Must-have", "c": "Fully Compliant", "a": "The cashback log shows each purchase with the bank's transaction ID, customer reference, date, amount and currency, cashback earned, reversed, balance, hold end date and payable status."}, "LAF-17": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Programme lifecycle", "r": "Support controlled activation, suspension, reactivation and closure of a programme without loss of historical records.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune and/or the bank can activate, suspends and reactivate each programme by configuration. Campaigns go live, and they complete at their end date or when the budget is used up. All history stays."}, "LAF-170": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Customer report", "r": "Report customer profile, status, tier, balances, issued, redeemed and expired points subject to data-access permissions.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank portal shows each customer’s reference, status and balance, and the points earned, redeemed and expired, within each user’s data permissions."}, "LAF-171": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Liability report", "r": "Report accrued, reversed, cancelled, redeemed, expired and outstanding liability by programme, product and period.", "pr": "Must-have", "c": "Partially Compliant", "a": "Earned, reversed and remaining cashback are available for each campaign. Merchant reporting will show the figures by period."}, "LAF-172": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Projected expiry report", "r": "Project expiring points by month and customer using current point lots and expiry policy.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform projects expiring points by month and by customer, using current point lots and each programme’s expiry rule."}, "LAF-173": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Communication report", "r": "Report communication event, channel, recipient reference, dates, delivery status and error reason.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune reports each message it prepares, with event, channel, customer reference, dates, delivery status and error reason."}, "LAF-174": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Processing logs", "r": "Report customer, card, transaction and bonus file/API processing status with downloadable errors.", "pr": "Must-have", "c": "Partially Compliant", "a": "Banks can query the status of each file."}, "LAF-175": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Exports", "r": "Export reports in CSV and PDF and support compression for large files.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank portal exports reports in CSV and PDF."}, "LAF-176": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Scheduled reports", "r": "Schedule recurring report generation and secure delivery or placement.", "pr": "Must-have", "c": "Partially Compliant", "a": "On the bank’s request, Lune’s team generates recurring reports and makes them available in the bank portal."}, "LAF-177": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Report retention", "r": "Configure report retention and automated deletion in line with policy.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team sets report retention for each bank, in line with its policy, and reports are deleted automatically when the retention period ends."}, "LAF-178": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Report calendar", "r": "Configure fiscal-year start, week start, reporting delay and programme time zone.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each market has one business time zone for cashback dates."}, "LAF-179": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Data consistency", "r": "Use consistent identifiers, currency, time zone and metric definitions across screens, reports and extracts.", "pr": "Must-have", "c": "Fully Compliant", "a": "All cashback figures use the bank's own transaction ID and the campaign currency, and they come from one ledger. The market's business time zone decides the cashback day of each purchase."}, "LAF-18": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Terminology", "r": "Allow configurable programme terminology for points, miles or other accrual units.", "pr": "Must-have", "c": "Fully Compliant", "a": "Terminology is configurable for points or other accural units which are displayed to the customer through our SDK."}, "LAF-180": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Operational dashboard", "r": "Provide dashboards for ingestion, rule processing, balances, exceptions, campaigns and service health.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune's operations team has dashboards and alerts for transaction intake and daily cashback processing."}, "LAF-181": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Reporting, Finance & Reconciliation", "sub": "Reconciliation extract", "r": "Provide detailed extracts to reconcile source transactions, calculated points, ledger postings and liability.", "pr": "Must-have", "c": "Partially Compliant", "a": "The cashback log gives, for each purchase, the transaction amount and the cashback earned, reversed and remaining."}, "LAF-19": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Multi-entity operation", "r": "Support multiple legal entities, issuers, business units and countries within a programme, with configurable ownership and reporting boundaries.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bank is a separate tenant with its own entity, country and currency. A group with several banks or countries uses one tenant for each."}, "LAF-2": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Mastercard operator role", "r": "Provide Mastercard with authorised portfolio-level visibility of implementations, service performance, configurations and operational risks while maintaining issuer data segregation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune's operations team has a portfolio view of all banks in each market, with service monitoring for each bank. Lune can give Mastercard agreed portfolio reports."}, "LAF-20": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Multi-currency operation", "r": "Process and report transactions in multiple source currencies using controlled conversion rates, dates and rounding rules.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign uses one currency, and every transaction keeps its original amount and currency. A purchase in a different currency is recorded with its reason and does not earn cashback."}, "LAF-200": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Approval & Control Framework", "sub": "Self-approval prevention", "r": "Prevent a requester from approving their own action and enforce incompatible-role controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "A campaign needs the bank's approval, so the merchant who requests it cannot approve it."}, "LAF-205": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Gamification", "sub": "Missions and challenges", "r": "Configure missions, challenges and milestone-based rewards using transaction, product, engagement, behavioural and relationship events, with eligibility, validity, completion criteria and reward outcomes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team configures missions, challenges and milestone rewards for the bank, using transaction, product, engagement, behavioural and relationship events. Each one has eligibility, validity dates, completion criteria and a reward, for example 500 points for 5 purchases in a month."}, "LAF-206": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Gamification", "sub": "Streak incentives", "r": "Support streak-based incentives for repeated or consistent customer behaviour, including configurable frequency, reset conditions, grace treatment and reward thresholds.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team configures streak rewards for repeated customer behaviour, with frequency, reset conditions, grace treatment and reward thresholds, for example bonus points for a purchase every week for four weeks."}, "LAF-207": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Gamification", "sub": "Badges and achievements", "r": "Create badges, achievements and milestone states with configurable qualification criteria, award rules and customer progress/status.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team configures badges, achievements and milestones, with qualification criteria and award rules. Customers see their progress and status in the bank’s app through the Lune SDK."}, "LAF-208": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Gamification", "sub": "Issuer self-service configuration", "r": "Allow authorised issuer users to create, configure, test, approve, activate and maintain gamification rules without vendor code changes or routine vendor dependency.", "pr": "Must-have", "c": "Fully Compliant", "a": "On the bank’s request, Lune’s team creates, tests and activates gamification rules, with no code changes. The bank approves each rule before it goes live."}, "LAF-209": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Relationship Rewards", "sub": "Multi-product relationship earning", "r": "Configure earning and bonus rules using a customer’s broader banking relationship, including cards, loans, deposits, savings and other issuer-defined products and product-holding attributes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team configures earning and bonus rules from the bank’s product events, such as cards, loans, deposits and savings. The bank sets the points for each and pays for them."}, "LAF-21": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Programme Configuration & Issuer Tenancy", "sub": "Configuration hierarchy", "r": "Support global, regional, market, issuer and programme configuration with defined inheritance and local override controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Configuration has three levels: the market deployment, the issuer and the campaign. The global and regional defaults sit in the market deployment, which also holds currency and time zone. The programme sits inside the issuer level, with the bank’s card products, modules, branding, point value, expiry rule and tiers. The campaign level holds the rate, dates, budget, customer cap, minimum spend, refund window and the cards that earn."}, "LAF-210": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Relationship Rewards", "sub": "Non-transactional relationship events", "r": "Configure earning and recognition rules using eligible non-transactional events such as anniversaries, birthdays, digital engagement, app logins, referrals, servicing events and other issuer-defined customer milestones.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s team configures earning and recognition rules from events the bank sends, such as anniversaries, birthdays, app logins, referrals and servicing events. The bank sets the points for each and pays for them."}, "LAF-22": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Retail loyalty use cases", "sub": "Value types", "r": "Support points, miles, cashback-equivalent units and other issuer-defined loyalty currencies using a common governed ledger.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps one governed ledger for cashback in the market currency. Each entry is permanent and links to its source transaction. Lune supports conversion of this currency into a points or cashback-equivalent unit."}, "LAF-23": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Retail loyalty use cases", "sub": "Earn sources", "r": "Support payment and non-payment earning sources including spend, product holding, acquisition, referrals, engagement and behavioural milestones.", "pr": "Must-have", "c": "Partially Compliant", "a": "Customers earn cashback on card purchases at participating merchants. Customers can also earn based on gamified milestones."}, "LAF-24": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Retail loyalty use cases", "sub": "Retail customer structures", "r": "Support individual, supplementary-card, household, family, SME and other issuer-defined customer relationships where applicable.", "pr": "Must-have", "c": "Partially Compliant", "a": "Cashback belongs to the bank's customer reference, so all cards and accounts of one customer earn together, including supplementary cards that the bank sends under that"}, "LAF-25": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Retail loyalty use cases", "sub": "Customer servicing", "r": "Enable authorised issuer and Mastercard operations teams to investigate balances, transactions, expiry, adjustments and exceptions using complete audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank portal shows each campaign's cashback for each purchase: earned, reversed, balance, hold date and payable. The platform records why each purchase earned or did not earn, and every ledger entry is permanent, so the history is complete."}, "LAF-26": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Retail loyalty use cases", "sub": "Market localisation", "r": "Support market-specific language, currency, time zone, privacy, retention, communication and operational requirements through configuration.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each market has its own in-country deployment, currency and business time zone. Transaction retention is set for each bank. Lune configures these settings for each market."}, "LAF-27": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer identity", "r": "Create and maintain a unique customer or relationship identifier and prevent unintended duplicate customer records.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform uses the bank's own customer reference as the unique identity, and keeps one record for each reference."}, "LAF-28": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer profile", "r": "Maintain customer demographic, contact, status, enrolment, activation, tier, language and programme-specific attributes.", "pr": "Must-have", "c": "Partially Compliant", "a": "The platform keeps the bank's pseudonymised customer reference with its accounts, cards and offer activations. By design, it keeps no names, contact details or any other personal data."}, "LAF-29": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer attributes", "r": "Allow administrators to create global and programme-specific customer attributes using string, integer, decimal, date, single-select and multi-select data types.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune builds customer attributes from each customer’s transactions, for example spend by category, merchants used, frequency, recency and average spend. The attributes are numbers, dates and categories, and campaign audiences use them with include and exclude rules and date windows. Lune’s team adds new attributes for a bank on request."}, "LAF-3": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Mastercard proposition model", "sub": "Issuer independence", "r": "Allow each issuer to maintain its own programme rules, branding, customer data, balances, reporting, languages, currencies and operating model.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each bank has a client portal to maintain their data, campaigns, card targeting and cashback records. Offers are managed on the bank portal, and use the market currency."}, "LAF-30": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Attribute controls", "r": "Configure customer attributes as mandatory, unique, searchable, filterable, personal information or hidden.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each customer attribute that Lune builds from transactions is filterable in campaign audiences. The attributes hold no personal information by design, so no attribute needs to be marked as personal or hidden."}, "LAF-31": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer status", "r": "Support active, suspended, blocked, closed and cancelled customer states with controlled reactivation and reason codes.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank sends the status (active, suspended, blocked, closed, cancelled) with a reason code, and we record each change. Reactivation happens when the bank sends “active” again."}, "LAF-32": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Status enforcement", "r": "Prevent or restrict redemption and other configured actions when the customer status is suspended, blocked or closed.", "pr": "Must-have", "c": "Fully Compliant", "a": "A suspended, blocked or closed customer cannot earn or redeem, and the points stay in the ledger."}, "LAF-33": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Customer profile audit", "r": "Retain an audit trail of profile, status, tier and attribute changes including old value, new value, user, date and reason.", "pr": "Must-have", "c": "Fully Compliant", "a": "The platform keeps a full history of offer activations and cashback decisions for each customer."}, "LAF-34": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Balance view", "r": "Display accrued, redeemed, expired, reversed, adjusted, pending and available balances with a clear balance calculation.", "pr": "Must-have", "c": "Fully Compliant", "a": "For each purchase in a campaign, the bank portal and customer SDK shows cashback earned, reversed, balance, the hold end date and if it is payable."}, "LAF-35": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Management", "sub": "Ledger view", "r": "Display customer transactions with transaction date, posting date, type, points, amount, narration and running balance.", "pr": "Must-have", "c": "Fully Compliant", "a": "The bank portal lists each customer’s transactions with transaction date, posting date, type, cashback or points, amount, description and running balance."}, "LAF-36": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Customer & Account Managemen
