"Fully Compliant", "a": "Each sourced offer is validated in the Admin portal and the exclusivity is marked."}, "OM-8.7": {"p": "OMS", "s": "OM-8 — Merchant-Funded Offer Sourcing", "sub": "Offer Sourcing & Merchant Operations", "r": "Record merchant funding commitments, discount economics, budget or inventory limits and any commercial dependencies for each sourced offer.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each offer records the merchant’s funding commitment and cashback terms: total budget, budget mode, cashback rate or fixed amount, cap per transaction, minimum spend and refund window."}, "RC-1": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Air Travel", "r": "Provide flight redemption inventory covering domestic and international routes, with search, pricing, availability, booking and servicing capability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Flight catalogue coverage will be delivered through an approved travel inventory partner."}, "RC-10": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Mobile Top-Up", "r": "Provide mobile airtime/data top-up redemptions across agreed operators and markets with immediate status confirmation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Airtime/data top-ups will be enabled through approved operator aggregators with operator coverage and transaction status interfaces."}, "RC-11": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Charity", "r": "Support donation redemptions to approved charities with confirmation, traceability and reporting.", "pr": "Must-have", "c": "Fully Compliant", "a": "Donation redemptions will be routed to approved charities through an authorised processing partner."}, "RC-12": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Cashback Redemption", "r": "Support redemption of loyalty value into issuer-approved cashback or statement-credit outcomes through an authorised downstream integration, without duplicating PCLO merchant-funded cashback qualification.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will orchestrate issuer-approved cashback or statement-credit redemption through authorised issuer/loyalty APIs, including debit, credit posting, status and reconciliation."}, "RC-13": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Peer-to-Peer Transfer", "r": "Support controlled peer-to-peer transfer or gifting of eligible loyalty value between approved programme members, subject to programme rules, limits and fraud controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will enable controlled peer-to-peer loyalty-value transfers through issuer/loyalty-ledger APIs, applying member eligibility, sender/recipient validation, limits, fraud screening and audit logging."}, "RC-14": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Rewards Gifting", "r": "Allow a customer to gift an eligible reward item, voucher or redemption to another recipient with delivery/status tracking and programme controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Eligible reward gifting will be supported through recipient capture and digital reward delivery workflows, in accordance with supplier transfer rules, privacy controls and message/status integration."}, "RC-15": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "POS Redemption Technology", "r": "Support redemption at POS through secure API, QR, barcode, voucher, token or integration methods and return an approved/declined outcome and reference.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will enable POS redemption via authorised acceptance integrations using secure APIs, vouchers, QR/barcodes or tokens, with online validation, decision references and reversal flows."}, "RC-16": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Other Categories", "r": "Allow additional redemption categories to be added through configuration and standard integration patterns without material platform redevelopment.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune’s API architecture will accommodate additional catalogue categories through configurable content models and reusable integration patterns, in accordance with category-specific assessment and effort."}, "RC-17": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Multi-Supplier", "r": "Aggregate inventory from multiple suppliers and clearly identify supplier, market, category, availability and dependency for each redemption item.", "pr": "Must-have", "c": "Fully Compliant", "a": "API-enabled multi-supplier architecture will combine catalogue feeds while retaining supplier identifiers, market, inventory and fulfilment dependencies."}, "RC-18": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Supplier Onboarding", "r": "Provide governed supplier onboarding, due diligence, contracting, integration, testing and activation workflows.", "pr": "Must-have", "c": "Fully Compliant", "a": "Supplier onboarding will follow a governed process covering due diligence, commercial approval, technical integration, testing and activation."}, "RC-19": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Supplier Coverage", "r": "Report supplier and catalogue coverage by market, category, local/regional/global source and fulfilment model.", "pr": "Must-have", "c": "Fully Compliant", "a": "A market/category/supplier coverage matrix will be supplied."}, "RC-2": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Hotels", "r": "Provide hotel redemption inventory across relevant markets and price points, with real-time availability, room/rate details, booking and servicing capability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Hotel inventory will be sourced through an approved accommodation partner, including live rates, room policies, booking confirmation and permitted modifications."}, "RC-20": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Catalogue Curation", "r": "Support programme-specific catalogue selection, inclusion/exclusion, ranking, merchandising and category curation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Programme-specific catalogue filtering, inclusion/exclusion and merchandising rules are API-enabled as configurable capabilities, in accordance with product validation and issuer approval."}, "RC-21": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Item Master", "r": "Maintain unique product/reward identifiers, supplier references, descriptions, images, terms, denomination, status and effective dates.", "pr": "Must-have", "c": "Fully Compliant", "a": "A normalized reward item record is API-enabled, including IDs, supplier SKU, title, assets, denomination, restrictions, effective dates and state."}, "RC-22": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Availability", "r": "Maintain real-time or agreed-frequency availability and prevent redemption of unavailable, suspended or expired items.", "pr": "Must-have", "c": "Fully Compliant", "a": "Supplier availability will be checked by live API or scheduled feed according to category, with expiry and suspension controls."}, "RC-23": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Variants", "r": "Support product variants, denominations, room/rate types, ticket classes and other category-specific item options.", "pr": "Must-have", "c": "Fully Compliant", "a": "Catalogue data model will accommodate denominations and category-specific variants (e.g., room/rate or ticket class) where supplier feeds expose these attributes."}, "RC-24": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Localisation", "r": "Support language, currency, market-specific content, local catalogues and right-to-left presentation where applicable.", "pr": "Must-have", "c": "Fully Compliant", "a": "Market, language and currency configurations are API-enabled, with RTL presentation."}, "RC-25": {"p": "Redemption Catalogue", "s": "2. Supplier & Catalogue Management", "sub": "Updates", "r": "Support controlled bulk and API-based catalogue updates, delta feeds, validation, effective dating and rollback.", "pr": "Must-have", "c": "Fully Compliant", "a": "Bulk file/API catalogue ingestion, change validation and effective-dating will be included in the implementation design; delta support and rollback depend on confirmed platform and supplier capabilities."}, "RC-28": {"p": "Redemption Catalogue", "s": "3. Customer Redemption Experience", "sub": "Search & Discovery", "r": "Support search, filter, sort, category, brand, location, value range, popularity and personalised/curated catalogue discovery using issuer-approved inputs.", "pr": "Must-have", "c": "Fully Compliant", "a": "Search and catalogue discovery will use approved taxonomy, category, brand, location and value filters."}, "RC-3": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Experiences", "r": "Provide redeemable experiences such as dining, leisure, attractions, wellness and local activities across agreed markets.", "pr": "Must-have", "c": "Fully Compliant", "a": "Dining, leisure, attractions and wellness experiences will be aggregated from contracted regional and global providers."}, "RC-30": {"p": "Redemption Catalogue", "s": "3. Customer Redemption Experience", "sub": "Accessibility", "r": "Support responsive and accessible customer experiences aligned to agreed issuer digital standards.", "pr": "Must-have", "c": "Fully Compliant", "a": "Customer experience will be designed against agreed accessibility and responsive-design standards, in accordance with the delivery model and formal testing requirements."}, "RC-31": {"p": "Redemption Catalogue", "s": "3. Customer Redemption Experience", "sub": "Cart & Checkout", "r": "Support cart, review, confirmation and checkout for eligible redemption categories with clear totals and final customer consent.", "pr": "Must-have", "c": "Fully Compliant", "a": "The API-enabled checkout flow covers review, consent, final value verification and fulfilment request."}, "RC-33": {"p": "Redemption Catalogue", "s": "3. Customer Redemption Experience", "sub": "Multi-Currency", "r": "Support programme currency and display currency logic with transparent conversion/rounding rules where relevant to the platform.", "pr": "Must-have", "c": "Fully Compliant", "a": "Programme/display currency and controlled conversion/rounding will be specified with issuer FX rules; foreign-exchange sourcing and any applicable fees must be agreed."}, "RC-4": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Sports & Events", "r": "Provide sports-event tickets and experiences with event, venue, date, inventory, fulfilment and servicing information.", "pr": "Must-have", "c": "Fully Compliant", "a": "Sports tickets and related experiences will use a specialist authorised ticketing partner."}, "RC-40": {"p": "Redemption Catalogue", "s": "4. Redemption Processing", "sub": "Idempotency", "r": "Provide idempotent redemption processing so retries cannot create duplicate debits, orders, bookings, vouchers or transfers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will enforce idempotency using unique request keys and end-to-end transaction references, preventing duplicate loyalty debits and duplicate downstream fulfilment upon retries."}, "RC-41": {"p": "Redemption Catalogue", "s": "4. Redemption Processing", "sub": "Status Model", "r": "Support initiated, pending, confirmed, fulfilled, failed, cancelled, reversed and refunded statuses with reason codes.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will provide a consistent order-state model covering initiated, pending, confirmed, fulfilled, failed, cancelled, reversed and refunded, with mapping to supplier statuses."}, "RC-45": {"p": "Redemption Catalogue", "s": "4. Redemption Processing", "sub": "POS Validation", "r": "For POS redemption, validate value and eligibility in real time and return decision, reason code, reference and reversal capability.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will support POS eligibility and value validation through real-time APIs, providing approval/decline outcome, reason code, reference and reversal capability via integrated acceptance partners."}, "RC-5": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Music & Arts", "r": "Provide music, theatre, cultural and arts-event tickets or experiences with inventory, terms and fulfilment support.", "pr": "Must-have", "c": "Fully Compliant", "a": "Music, theatre and cultural experiences will be supplied through specialist ticketing partners."}, "RC-50": {"p": "Redemption Catalogue", "s": "5. Integration & Interoperability", "sub": "Batch Interfaces", "r": "Support secure files for catalogue, orders, fulfilment status, reconciliation and reporting where real-time APIs are not used.", "pr": "Must-have", "c": "Fully Compliant", "a": "Encrypted batch exchange will be used where real-time integrations are not available."}, "RC-55": {"p": "Redemption Catalogue", "s": "5. Integration & Interoperability", "sub": "Multi-Tenant", "r": "Support segregated Mastercard, issuer/non-issuer, market and programme configurations, catalogues, users, balances/order references and reports.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune will support logical segregation of issuer, non-issuer, programme, geography and tenant configurations, catalogue permissions, access controls, transaction references and reporting."}, "RC-6": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Car Rental", "r": "Provide car-rental redemption inventory with vehicle, location, date, rate, eligibility, booking and servicing information.", "pr": "Must-have", "c": "Fully Compliant", "a": "Car-rental bookings will be enabled via a specialist rental inventory integration."}, "RC-61": {"p": "Redemption Catalogue", "s": "6. Fulfilment & Servicing", "sub": "Customer Support", "r": "Provide tools for authorised L1/L2 users to search by customer, order, booking, voucher, transfer or redemption reference and see the end-to-end decision/status trail.", "pr": "Must-have", "c": "Fully Compliant", "a": "Authorised support users will have a consolidated order lookup and status/audit trail."}, "RC-7": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Merchandise", "r": "Provide a multi-category merchandise catalogue with product details, availability, redemption value and order-status support.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchandise rewards will be offered through marketplace or distributor integrations, including product attributes, price, stock and fulfilment references."}, "RC-71": {"p": "Redemption Catalogue", "s": "8. Reporting & Operations", "sub": "Catalogue Reporting", "r": "Report catalogue breadth, supplier/category coverage, active/inactive items, availability, additions, removals and content quality.", "pr": "Must-have", "c": "Fully Compliant", "a": "Catalogue coverage, supplier availability, item status, updates and content quality are available through reporting APIs and dashboards."}, "RC-72": {"p": "Redemption Catalogue", "s": "8. Reporting & Operations", "sub": "Redemption Reporting", "r": "Report attempts, successful, pending, failed, cancelled and reversed redemptions by issuer, market, category, supplier, item and channel.", "pr": "Must-have", "c": "Fully Compliant", "a": "Redemption attempts and outcomes are reported by issuer, market, category, supplier, item and channel."}, "RC-8": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Gift Cards", "r": "Provide physical and/or digital gift cards and eVouchers across local, regional and global brands, with value denominations and availability controls.", "pr": "Must-have", "c": "Fully Compliant", "a": "Digital and, where available, physical gift cards/eVouchers will be provided through authorised aggregators."}, "RC-9": {"p": "Redemption Catalogue", "s": "1. Catalogue Breadth", "sub": "Halal Marketplace", "r": "Provide a configurable halal marketplace/category containing appropriately verified products, services or merchants and supporting evidence for the applicable verification method.", "pr": "Must-have", "c": "Fully Compliant", "a": "A dedicated halal category will be curated using supplier-provided verification evidence and configurable catalogue rules."}};</script><script>/* RFP requirement tooltips. Any element with data-req="CL-3.15 CL-3.16", and any .rid or .badge whose text names
   requirement IDs, shows the requirement, our compliance status and our answer on hover and keyboard focus.
   window.RFP_REQS is injected by src/build.py with only the rows the page uses (answers as of the capture date). */
(function () {
  'use strict';
  var REQS = window.RFP_REQS || {};
  var ID = /\b(CL|OM|MS|RC|LAF|LIT|LVP)-(\d+)(?:\.(\d+))?/;
  function parse(text) {
    var out = [], prefix = null, major = null, dotted = false, last = null, pendingRange = false;
    var tokens = String(text).match(/(CL|OM|MS|RC|LAF|LIT|LVP)-\d+(?:\.\d+)?|\d+(?:\.\d+)?|\bto\b/g) || [];
    tokens.forEach(function (t) {
      if (t === 'to') { pendingRange = !!last; return; }
      var m = t.match(ID), id;
      if (m) { prefix = m[1]; dotted = !!m[3]; major = m[2]; id = t; }
      else if (prefix) {
        if (dotted) id = prefix + '-' + (t.indexOf('.') > -1 ? t : major + '.' + t);
        else if (t.indexOf('.') < 0) id = prefix + '-' + t;
        else return;
      } else return;
      if (pendingRange && last) {
        var a = last.match(ID), b = id.match(ID);
        if (a && b && a[1] === b[1]) {
          if (a[3] && b[3] && a[2] === b[2]) for (var i = +a[3] + 1; i < +b[3] && out.length < 60; i++) add(a[1] + '-' + a[2] + '.' + i);
          else if (!a[3] && !b[3]) for (var j = +a[2] + 1; j < +b[2] && out.length < 60; j++) add(a[1] + '-' + j);
        }
        pendingRange = false;
      }
      add(id); last = id;
    });
    function add(x) { if (out.indexOf(x) < 0) out.push(x); }
    return out;
  }
  window.parseReqIds = parse;
  var tip = document.createElement('div');
  tip.id = 'req-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  var css = document.createElement('style');
  css.textContent = '#req-tip{position:fixed;z-index:90;max-width:24rem;background:#0a634d;color:#ffffff;border-radius:calc(var(--radius,.5rem) - 2px);padding:.625rem .75rem;font:500 .75rem/1.05rem var(--font-sans,"Plus Jakarta Sans",sans-serif);box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;text-align:left}' +
    '#req-tip .rq{padding:.375rem 0;border-top:1px solid rgba(255,255,255,.2)}#req-tip .rq:first-child{border-top:0;padding-top:0}#req-tip .rq:last-child{padding-bottom:0}' +
    '#req-tip b{font-weight:700}#req-tip .st{display:inline-block;margin-left:.375rem;padding:0 .375rem;border-radius:9999px;background:rgba(255,255,255,.18);font-size:.6875rem}' +
    '#req-tip .tx{margin-top:.125rem}#req-tip .an{margin-top:.25rem;opacity:.85}#req-tip .more{margin-top:.375rem;opacity:.85}' +
    '[data-req],.rid,.badge{cursor:help}[data-req]:focus-visible,.rid:focus-visible,.badge:focus-visible{outline:2px solid var(--ring,#10a37f);outline-offset:2px}';
  document.head.appendChild(css);
  function cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function status(c) { return !c ? 'No answer yet' : /^Fully/.test(c) ? 'Fully Compliant' : /^Partial/.test(c) ? 'Partially Compliant' : /^Not/.test(c) ? 'Not Compliant' : String(c).replace(/\s*·\s*on the roadmap/gi, ''); }
  var PLANNED = /roadmap|delivery plan|planned/i;
  function answer(a) { return String(a || '').split(/(?<=[.!?])\s+/).filter(function (x) { return x && !PLANNED.test(x); }).join(' '); }
  function idsFor(el) {
    var src = el.getAttribute('data-req');
    if (src === null) { if (!el.classList.contains('rid') && !el.classList.contains('badge')) return []; src = el.textContent; }
    return parse(src).filter(function (x) { return REQS[x]; });
  }
  function target(e) {
    var el = e.target && e.target.closest && e.target.closest('[data-req], .rid, .badge');
    return el && idsFor(el).length ? el : null;
  }
  function show(el, x, y) {
    var ids = idsFor(el), max = 4;
    tip.innerHTML = ids.slice(0, max).map(function (id) {
      var r = REQS[id];
      return '<div class="rq"><b>' + id + '</b><span class="st">' + esc(status(r.c)) + (r.pr ? ' · ' + esc(r.pr) : '') + '</span><div class="tx">' + esc(cut(r.r, 220)) + '</div>' + (answer(r.a) ? '<div class="an">Our answer: ' + esc(cut(answer(r.a), 200)) + '</div>' : '') + '</div>';
    }).join('') + (ids.length > max ? '<div class="more">+' + (ids.length - max) + ' more: ' + ids.slice(max).join(', ') + '</div>' : '');
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 12)) + 'px';
    tip.style.top = (y - h - 12 < 8 ? y + 20 : y - h - 12) + 'px';
  }
  document.addEventListener('pointerover', function (e) { var el = target(e); if (el) show(el, e.clientX, e.clientY); });
  document.addEventListener('pointerout', function (e) { var el = target(e); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
  document.addEventListener('focusin', function (e) { var el = target(e); if (el) { var r = el.getBoundingClientRect(); show(el, r.left, r.top); } });
  document.addEventListener('focusout', function (e) { if (target(e)) tip.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') tip.hidden = true; });
  function arm() {
    var els = document.querySelectorAll('[data-req], .rid, .badge');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute('data-req-armed')) continue;
      el.setAttribute('data-req-armed', '');
      if (!idsFor(el).length) continue;
      if (!el.matches('a, button, input, select, textarea, [tabindex]')) el.setAttribute('tabindex', '0');
      if (!el.getAttribute('aria-describedby')) el.setAttribute('aria-describedby', 'req-tip');
    }
  }
  new MutationObserver(arm).observe(document.body, { childList: true, subtree: true });
  arm();
})();
</script>
<script id="pitch-mode">/* Pitch mode (16 Nov 2026): hides the internal RFP review marks (answer labels, legends, row tooltips, mode switch).
   Same rules as rfp-work/clean.js for the deck shots, but it keeps running while the app re-renders. */
(function () {
  var L = new Set(['Fully Compliant', 'Partially Compliant', 'Partially Compliant · available today', 'Partially Compliant · in delivery plan', 'Not available · in delivery plan', 'Answers conflict', 'Not in our answers', 'No answer yet', 'Not Compliant', 'On the product roadmap', 'On the product roadmap.', 'Partially Compliant · on the roadmap', 'Not available · on the roadmap', 'On the roadmap', 'Available today']);
  var st = document.createElement('style');
  st.textContent = '[data-cx=labels],.cx-tag,.mx-tag,[data-ext=switch],[data-legend],#req-tip,.rid{display:none!important}';
  document.head.appendChild(st);
  var LEG = /^(Labels (come from|show what) our RFP answers|Showing only what our answers say)/;
  function clean() {
    document.querySelectorAll('span,div,p,small,em,b,i').forEach(function (e) {
      if (e.dataset.pitchHidden) return;
      var t = (e.textContent || '').trim();
      if ((L.has(t) && e.querySelectorAll('*').length <= 1) || (LEG.test(t) && t.length < 220)) { e.style.display = 'none'; e.dataset.pitchHidden = '1'; }
    });
    document.querySelectorAll('[data-req][title]').forEach(function (e) { e.removeAttribute('title'); });
  }
  var q = false;
  new MutationObserver(function () { if (!q) { q = true; requestAnimationFrame(function () { q = false; clean(); }); } })
    .observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', clean); else clean();
})();
</script>
