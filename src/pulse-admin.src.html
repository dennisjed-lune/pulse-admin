/* ---------- 1. Campaign Requests (real list) ---------- */
function pgRequests() {
  const base = REQS.filter(o => (!S.fregion || o.region === S.fregion || S.fregion === 'UAE') && (!S.fmerch || o.m === S.fmerch) && (!S.ftid || (o.banks || []).some(b => TID(b.n) === S.ftid)));
  const L = base.filter(o => !S.fst || o.st === S.fst);
  const cnt = s => base.filter(o => o.st === s).length;
  return head('', 'CLO Campaign Requests', 'Card-linked campaign requests from merchants. Lune operations reviews and configures each one, then sends it to one or more banks. Affiliate campaigns come from a network and sit in the Affiliate Ledger.', legend()) +
    '<div class="content">' +
    card('Requests', '', tagB('OM-1.14 LAF-16'),

      '<div class="tabs" role="tablist" data-req="OM-1.14">' + [['', 'All', base.length]].concat(RSTAT.map(s => [s, s, cnt(s)])).map(t => '<button class="tab" role="tab" data-fst="' + t[0] + '" aria-selected="' + (S.fst === t[0]) + '">' + t[1] + ' <span class="muted">' + t[2] + '</span></button>').join('') + '</div>' +

      (L.length ? L.map(o => '<tr style="cursor:pointer" data-row="request/' + o.id + '"><td>UAE</td><td>' + o.m + '</td><td><button class="lnk" data-go="request/' + o.id + '">' + o.t + '</button></td><td>' + o.goal + '</td><td class="r num">' + n0(o.budget) + '</td><td>' + stBadge(o.st) + '</td><td class="num">' + o.sub + '</td></tr>').join('') : '<tr><td colspan="7" class="muted">No campaign requests match these filters.</td></tr>') + '</tbody></table></div>' +
      '<div class="hrow sm muted"><span>Total ' + L.length + '</span><span class="sp"></span><span>Page 1 of 1</span><button class="ib" disabled aria-label="Previous page">' + svg('<path d="m15 18-6-6 6-6"/>') + '</button><button class="ib" disabled aria-label="Next page">' + svg('<path d="m9 18 6-6-6-6"/>') + '</button></div>', '', 'OM-1.14 LAF-16') +
    '</div>';
}

/* ---------- 2. Campaign Request detail ---------- */
const reqDetails = o => card('Campaign Request Details', '', tagB('CL-11.21 OM-11.1'),
  '<dl class="kv"><dt>Merchant</dt><dd>' + o.m + '</dd><dt>Region</dt><dd>UAE</dd><dt>Tenant IDs</dt><dd data-req="LAF-9 OM-2.1">' + (o.banks.length ? o.banks.map(b => TID(b.n)).join(', ') : '<span class="muted" style="font-weight:500">Not yet assigned</span>') + '</dd><dt>Goals</dt><dd>' + o.goal + '</dd><dt>Monthly marketing budget</dt><dd>' + aed(o.mbud) + '</dd><dt>Avg transaction value</dt><dd>' + aed(o.atv) + '</dd><dt>Avg monthly orders</dt><dd>' + n0(o.orders) + '</dd><dt>Submitted</dt><dd>' + o.sub + '</dd></dl>', '', 'CL-11.21 OM-11.1');
const brandIds = (o, locked) => card('Brand &amp; Identifiers', locked ? '' : 'Lune operations checks the MIDs and terminals before the bank sees the campaign.', tagB('CL-13.3 CL-13.11') + (locked ? tagB('CL-13.2') : ''),
  '<dl class="kv"><dt>Brand</dt><dd>' + o.brand + '</dd><dt>MIDs</dt><dd class="num">' + o.mids.join(', ') + '</dd><dt>TIDs</dt><dd class="num">' + o.tids.join(', ') + '</dd><dt>Channel</dt><dd>' + o.chan + '</dd></dl>' + (locked ? '<p class="sm muted" data-req="CL-13.2">These MIDs are locked while a live campaign uses them.</p>' : '<p class="sm muted" data-req="CL-13.3">No duplicates. Pulse rejects duplicate MIDs and terminal IDs.</p>'), '', 'CL-13.3 CL-13.11 CL-13.2');
/* Targeting (CL-4.1, CL-4.4, OM-5.2, OM-5.3, LAF-146, CL-11.9): the audience is a query over the customer's enriched transaction history. Each row: subject (merchant or category), measure (number of purchases or total spend), operator, value, window in days. */
const TG_MERCH = ['Carrefour', 'Lulu', 'Spinneys', 'Starbucks', "McDonald's", 'Subway', 'Noon', 'Namshi', 'Expedia', '%Arabica'];
const TG_CAT = ['Groceries', 'Dining', 'Coffee shops', 'Fashion', 'Electronics', 'Travel', 'Fuel'];
const TG_CARDS = ['Nova Platinum Credit', 'Nova Signature Credit', 'Nova World Elite', 'Nova Everyday Debit', 'Nova Titanium Credit', 'Nova Infinite'];
const TG_MEAS = [['count', 'Number of purchases'], ['spend', 'Total spend in AED']];
const TG_OP = [['least', 'At least'], ['most', 'At most'], ['between', 'Between']];
const tgVal = (r, v) => r.meas === 'spend' ? 'AED ' + n0(v || 0) : n0(v || 0);
const tgText = (k, r) => k === 'sup' ? 'Activated an offer ' + (r.subj === 'merchant' ? 'at ' : 'in ') + r.val + ', last ' + r.days + ' days' :
  (r.meas === 'spend' ? 'Total spend' : 'Number of purchases') + (r.subj === 'merchant' ? ' at ' : ' in ') + r.val + ', ' + (r.op === 'between' ? 'between ' + tgVal(r, r.v1) + ' and ' + tgVal(r, r.v2) : (r.op === 'most' ? 'at most ' : 'at least ') + tgVal(r, r.v1)) + ', last ' + r.days + ' days';
const tgRow = (k, r, i) => {
  const id = 'tg-' + k + '-' + i, at = f => 'data-tg="' + k + ':' + i + ':' + f + '"';
  const subj = sel(id + '-s', 'Subject', [['merchant', 'Merchant or brand'], ['category', 'Category']], r.subj, '', at('subj'));
  const val = sel(id + '-v', r.subj === 'merchant' ? 'Merchant or brand' : 'Category', r.subj === 'merchant' ? TG_MERCH : TG_CAT, r.val, '', at('val'));
  const days = inp(id + '-d', 'Last N days', r.days, '', 'type="number" inputmode="numeric" min="1" ' + at('days'));
  const del = '<button class="ib" data-tgdel="' + k + ':' + i + '" aria-label="Remove row">' + svg(I.x) + '</button>';
  if (k === 'sup') return '<div class="rb" data-req="OM-5.3"><div class="rb-h"><span class="k sup rule-k">Skip</span><span class="rb-s">' + esc(tgText(k, r)) + '</span><span class="sp"></span>' + del + '</div><div class="rb-g">' + subj + val + days + '</div></div>';
  const meas = sel(id + '-m', 'Measure', TG_MEAS, r.meas, '', at('meas'));
  const op = sel(id + '-o', 'Operator', TG_OP, r.op, '', at('op'));
  const lab = r.meas === 'spend' ? 'AED' : 'Purchases';
  const v1 = inp(id + '-1', r.op === 'between' ? 'From (' + lab + ')' : 'Value (' + lab + ')', r.v1, '', 'inputmode="numeric" ' + at('v1'));
  const v2 = r.op === 'between' ? inp(id + '-2', 'To (' + lab + ')', r.v2, '', 'inputmode="numeric" ' + at('v2')) : '<div></div>';
  return '<div class="rb" data-req="' + (k === 'inc' ? 'CL-4.1 CL-4.4 OM-5.2 LAF-146' : 'OM-5.3 LAF-146') + '"><div class="rb-h"><span class="k ' + k + ' rule-k">' + (k === 'inc' ? 'Include' : 'Exclude') + '</span><span class="rb-s">' + esc(tgText(k, r)) + '</span><span class="sp"></span>' + del + '</div>' +
    '<div class="rb-g">' + subj + val + meas + '</div><div class="rb-g2">' + op + v1 + v2 + days + '</div></div>';
};
const tgRo = (k, r) => '<div class="rule" data-req="' + (k === 'sup' ? 'OM-5.3' : k === 'inc' ? 'CL-4.1 CL-4.4 OM-5.2 LAF-146' : 'OM-5.3 LAF-146') + '"><span class="k ' + k + '">' + ({ inc: 'Include', exc: 'Exclude', sup: 'Skip' }[k]) + '</span><span>' + esc(tgText(k, r)) + '</span><span></span></div>';
const audiencePanel = (o, ro) => {
  const T = S.rv.tg, sec = (k, title, hint) => '<div class="rb-sec"><p class="sm b">' + title + '</p>' + (T[k].length ? T[k].map((r, i) => tgRow(k, r, i)).join('') : '<p class="sm muted">' + hint + '</p>') + '</div>';
  const cardRow = ro ? '<div class="rule" data-req="CL-3.12 OM-5.1"><span class="k inc">Card product</span><span>' + (T.cards.length ? esc(T.cards.join(', ')) : 'All card products') + '</span><span></span></div>' :
    '<fieldset class="fg" data-req="CL-3.12 OM-5.1"><legend class="flabel">Card product</legend><div class="tchk">' + TG_CARDS.map(c => '<label class="tck"><input type="checkbox" data-tgcard="' + esc(c) + '"' + (T.cards.includes(c) ? ' checked' : '') + '><span><b>' + c + '</b></span></label>').join('') + '</div><p class="fhint">Leave all empty for every card product. The bank confirms its card programmes when it approves.</p></fieldset>';
  const body = ro ? '<div class="stack">' + ['inc', 'exc', 'sup'].map(k => T[k].map(r => tgRo(k, r)).join('')).join('') + '</div>' :
    '<div class="stack">' +
    sec('inc', 'Include customers who match all of these rows', 'No include rows. Every customer is eligible. The bank chooses the card programmes and BINs when it reviews the offer.') +
    sec('exc', 'Exclude customers who match any of these rows', 'No exclusions.') +
    sec('sup', 'Skip customers with recent offer activity', 'No skip rule.') +
    '<div class="hrow"><button class="btn" data-tgadd="inc">' + svg(I.plus) + 'Add include row</button><button class="btn" data-tgadd="exc">' + svg(I.plus) + 'Add exclusion</button><button class="btn" data-tgadd="sup">' + svg(I.plus) + 'Add skip rule</button><span class="sp"></span><button class="btn" data-test data-req="CL-11.9">Test audience</button></div>' +
    '<p class="fhint">Rules read the customer\'s enriched transaction history. Customers are identified by tokenised IDs only.</p>' +
    (S.rv.tested ? '<div class="note" data-req="CL-11.9"><b>Test result:</b> 48,210 eligible customers in ' + esc(S.rv.tenant || 'Nova Bank') + '. 9,844 removed by exclusions and skip rules. Sample IDs: CUS-7F3A21, CUS-2B71F0, CUS-88D2B7.</div>' : '') + '</div>';
  return card('Targeting', ro ? 'The audience for this offer.' : 'Build the audience from the customer\'s transaction history. Each row sets a merchant or category, a measure, a value and a window.', tagB('CL-4.1 CL-4.4 OM-5.2 LAF-146') + tagB('OM-5.3') + tagB('CL-3.12 OM-5.1') + tagB('CL-11.9'), body, '', 'CL-4.1 CL-4.4 OM-5.2 OM-5.3 LAF-146 CL-3.12 OM-5.1 CL-11.9');
};
const prioPanel = o => card('Campaign Priority', 'In a group, only the highest-priority campaign that qualifies pays.', tagB('LAF-94 LAF-95'),
  '<div class="stack"><p class="sm b">Group: ' + S.rv.tenant + ' · Groceries</p>' + S.rv.prio.map((c, i) => '<div class="prio' + (c === o.t ? ' me' : '') + '" data-req="LAF-95 LAF-94"><span class="n">' + (i + 1) + '</span><span><b>' + c + '</b>' + (c === o.t ? ' <span class="sm muted">This campaign</span>' : '') + '</span><button class="ib" data-prio="' + i + ':-1" aria-label="Move up"' + (i ? '' : ' disabled') + '>' + svg(I.up) + '</button><button class="ib" data-prio="' + i + ':1" aria-label="Move down"' + (i < S.rv.prio.length - 1 ? '' : ' disabled') + '>' + svg(I.down) + '</button></div>').join('') +
  '<div class="row2" style="align-items:end">' + inp('prioEff', 'Applies from', S.rv.prioEff, 'LAF-95', 'type="date"') + '<div><button class="btn" data-prio-send' + (S.rv.prioSent ? ' disabled' : '') + '>' + (S.rv.prioSent ? 'Sent for approval' : 'Submit for approval') + '</button></div></div>' +
  '<p class="fhint" data-req="LAF-95">A second Lune admin approves the change. It goes into the audit history.</p></div>', '', 'LAF-95 LAF-94 CL-3.17');
const isPromo = o => o.type === 'promo';
const phone = (o, f) => '<div class="phone" data-req="OM-1.11"><div class="cover"><span class="logo">' + esc(o.m.slice(0, 4)) + '</span></div><div class="pb"><span class="sm muted">' + o.m + '</span><h4>' + esc(f.name) + '</h4><span class="big">' + f.cb + (isPromo(o) ? '% off with code' : '% cashback') + '</span><span class="sm">' + esc(f.desc) + '</span>' +
  (isPromo(o) ? '<ol><li>Show the code.</li><li>Shop at ' + o.m + ' through the offer link.</li><li>Enter the code at checkout.</li></ol>' : '<ol><li>Activate the offer.</li><li>Pay with your ' + (S.rv.tenant || 'bank') + ' card at ' + o.m + '.</li><li>Cashback goes to your card.</li></ol>') + '<span class="sm muted">Valid ' + dmy(f.from) + ' to ' + dmy(f.to) + '.</span><span class="cta">' + (isPromo(o) ? 'Show code' : 'Activate offer') + '</span></div></div>';
/* Promo codes (OM-4.10, OM-4.11, MS-17): the merchant provides the codes through our affiliate network partner. Lune reads availability, validity and expiry from the network feed. Code inventory and replenishment stay with the merchant and the partner. */
const promoPanel = (o, locked) => !o.promo ? '' : card('Promo Codes', 'The merchant provides the codes through our affiliate network partner. Lune reads availability, validity and expiry from the network feed.', tagB('OM-4.10 OM-4.11 MS-17'),
  '<div class="row3">' + inp('pcSrc', 'Source', o.promo.source, 'OM-4.10 MS-17', 'readonly') + sel('pcType', 'Code type', [['Static', 'Static: one code for the offer'], ['Single-use', 'Single-use codes']], o.promo.codeType, 'OM-4.10', locked ? 'disabled' : '') + inp('pcQty', 'Quantity received', n0(o.promo.qty), 'OM-4.10 MS-17', 'readonly') +
  inp('pcFrom', 'Valid from', o.promo.from, 'OM-4.10', 'type="date" readonly') + inp('pcTo', 'Valid till', o.promo.to, 'OM-4.10 OM-4.11', 'type="date" readonly') + inp('pcLeft', 'Remaining availability', n0(o.promo.remaining) + ' of ' + n0(o.promo.qty), 'OM-4.11', 'readonly', 'Read from the network feed.') + '</div>' +
  (o.promo.reveals ? '<dl class="kv" data-req="OM-6.8 CL-3.1 OM-4.11"><dt>Code reveals</dt><dd>' + n0(o.promo.reveals) + '</dd><dt>Purchases reported by the network</dt><dd>' + n0(o.promo.reported) + '</dd></dl>' : '') +
  '<p class="fhint" data-req="OM-4.1 OM-4.11">The bank app shows the code and a tracked link. The merchant checkout validates the code. When a code expires or runs out, Lune stops showing it.</p>', '', 'OM-4.10 OM-4.11 MS-17');
const capTx = o => o.capTx || Math.max(5, Math.round((o.cap || 75) * 0.4 / 5) * 5);
const offerForm = o => ({ name: o.t.split(' · ')[1], desc: o.desc || 'Get ' + (o.cb || 7) + '% cashback on purchases of AED ' + (o.min || 150) + ' or more. Up to AED ' + capTx(o) + ' for each purchase and AED ' + (o.cap || 75) + ' for each customer during the campaign.', cb: o.cb || 7, from: o.from || '2026-12-01', to: o.to || '2027-03-31' });

/* Tenants (banks): one offer can go to several tenants. Each bank then reviews it on its own (OM-2.1, MS-55). */

  '</div><p class="fhint">The offer goes to each bank for its own review. The bank chooses the programme when it approves.</p>' + (S.rv.tenErr ? '<p class="ferr" role="alert">Select at least one bank.</p>' : '') + '</fieldset>';
const banksCard = o => {
  const open = o.st !== 'Offer completed';
  return card('Banks', 'The offer goes to each bank for its own review. Each bank selects card programmes, card products by BIN, or both in LuneHub.', tagB('OM-2.1 MS-55') + tagB('CL-11.3 OM-1.6'),
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bank (tenant)</th><th>Programme</th><th>Status</th><th>Card programmes and BINs</th><th>Sent</th></tr></thead><tbody>' +
    o.banks.map(b => '<tr data-req="OM-2.1 CL-11.3 OM-1.6"><td><b>' + b.n + '</b><small style="white-space:nowrap">' + TID(b.n) + '</small></td><td class="wrap" data-req="LAF-9">' + (pgOf(b) ? esc(pgOf(b)) : '<span class="muted">' + (b.st === 'Rejected' ? 'None' : 'The bank chooses it when it approves') + '</span>') + '</td><td class="wrap">' + stBadge(b.st) + (b.reason ? '<small>Reason: ' + esc(b.reason) + '</small>' : '') + '</td><td class="wrap" data-req="CL-3.12 CL-3.13 CL-11.3">' + (b.progs.length ? b.progs.join(', ') : '<span class="muted">' + (b.st === 'Rejected' ? 'None' : 'The bank selects them when it approves') + '</span>') + '</td><td class="num">' + b.sent + '</td></tr>').join('') + '</tbody></table></div>' +
    '<div class="hrow"><p class="sm muted">Read only. Each bank selects its own card programmes and BINs.</p><span class="sp"></span>' + (open ? '<button class="btn" data-sheet="sendbank:' + o.id + '" data-req="OM-2.1 MS-55">' + svg(I.plus) + 'Send to another bank</button>' : '') + '</div>', '', 'OM-2.1 MS-55 CL-11.3 OM-1.6');
};

        '<div class="row2">' + inp('ofRegion', 'Region', 'UAE', 'OM-4.7', 'readonly', 'From the campaign request.') + inp('ofName', req('Offer Name'), f.name, 'OM-1.6 OM-1.18 OM-1.2') + '</div>' +

        '<div class="row2">' + sel('ofType', req('Offer Type'), [['card', 'Card-linked'], ['promo', 'Promo code']], isPromo(o) ? 'promo' : 'card', 'OM-1.1 OM-4.1') + inp('ofVal', 'Validation Method', isPromo(o) ? 'Code at merchant checkout. The affiliate network reports the purchase.' : 'Card transaction, automatic', 'OM-4.1', 'readonly', 'Set by the offer type.') + '</div>' +

        '<div class="row3">' + inp('ofCb', isPromo(o) ? 'Discount % (with code)' : 'Cashback %', o.cb, isPromo(o) ? 'OM-1.1' : 'CL-3.4', 'inputmode="decimal"') + inp('ofCapTx', 'Cap per transaction (AED)', capTx(o), 'OM-8.7', 'inputmode="decimal"') + inp('ofCap', 'Cap per customer for the campaign (AED)', o.cap, 'CL-3.3', 'inputmode="decimal"') + inp('ofMin', 'Min Transaction Value (AED)', o.min, 'CL-3.5 OM-1.4', 'inputmode="decimal"') +
        inp('ofRefund', 'Refund Window (days)', o.refund, 'CL-7.9', 'inputmode="numeric"') + sel('ofMode', req('Budget Mode'), ['Fixed Duration', 'Until Budget Exhausted'], o.mode, 'CL-3.11') + inp('ofBudget', req('Budget (AED)'), n0(o.budget), 'CL-3.11 OM-1.4 OM-1.16', 'inputmode="decimal"') + inp('ofStart', 'Start Date', o.from, 'OM-1.6', 'type="date"') + inp('ofEnd', 'End Date', o.to, 'OM-1.6', 'type="date"') + '</div>' +
        '<div class="row2">' + sel('ofEx', 'Exclusivity', ['Exclusive', 'Semi-exclusive', 'Publicly available'], S.rv.ex, 'OM-8.6 MS-16') + inp('ofRestr', 'Restrictions', S.rv.restr, 'MS-16', 'placeholder="Channel, issuer, market or competitor"', 'Optional. Part of the offer, not a bank assignment.') + '</div>', '', 'OM-1.6 CL-11.3 CL-3.4 CL-3.5 CL-3.11 OM-2.1') +
        promoPanel(o, false) + audiencePanel(o, false) + prioPanel(o) +

  if (t.id === 'evprog') { S.ev.prog = t.value; S.ev.page = 1; return render(); }
  if (t.id === 'evev') { S.ev.ev = t.value; S.ev.page = 1; return render(); }
  if (t.id === 'evst') { S.ev.st = t.value; S.ev.page = 1; return render(); }
  if (t.id === 'evfrom') { S.ev.from = t.value; S.ev.page = 1; return render(); }
  if (t.id === 'evto') { S.ev.to = t.value; S.ev.page = 1; return render(); }
  if (t.id === 'oftype') { S.of.type = t.value; return render(); }
  if (t.id === 'ofbank') { S.of.bank = t.value; return render(); }
  if (t.id === 'ofsort') { S.of.sort = t.value; return render(); }
  if (d.tg) { const [k, i, f] = d.tg.split(':'), r = S.rv.tg[k][+i]; r[f] = t.value; if (f === 'subj') r.val = (t.value === 'merchant' ? TG_MERCH : TG_CAT)[0]; if (f === 'op' && t.value === 'between' && !r.v2) r.v2 = String((+r.v1 || 0) * 2 || 10); S.rv.tested = false; return render(); }
  if (d.tgcard) { const c = d.tgcard, T = S.rv.tg; T.cards = t.checked ? TG_CARDS.filter(x => x === c || T.cards.includes(x)) : T.cards.filter(x => x !== c); S.rv.tested = false; return render(); }
  if (t.id && t.id.startsWith('gr') && S.sheet && S.sheet.startsWith('grule:')) { const k = t.id.slice(2).replace(/^./, c => c.toLowerCase()); S.gr[k] = t.value; S.grErr = ''; if (k === 'type') S.gr.rtype = t.value === 'Badge' ? 'Badge' : 'Points'; S.grTried = false; return render(); }
  if (t.id === 'prioEff') S.rv.prioEff = t.value;
  if (t.id === 'rpOff') S.reproc.off = t.value;
  if (t.id === 'rpDate') S.reproc.date = t.value;
  if (d.ex) { SOURCED[+d.ex].ex = t.value; return toast('Exclusivity marked: ' + t.value + '.'); }
  if (d.urole) { ADMINS[+d.urole][1] = t.value; return toast('Role changed to ' + t.value + '.'); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'ofq') S.of.q = e.target.value;
  else if (id === 'evq') { S.ev.q = e.target.value; S.ev.page = 1; }
  else if (id === 'afq') S.af.q = e.target.value;
  else if (id === 'apq') { S.ap.q = e.target.value; S.ap.page = 1; }
  else if (id === 'riq') { S.ri.q = e.target.value; S.ri.page = 1; }
  else if (id === 'rcq') { S.rc.q = e.target.value; S.rc.page = 1; }
  else if (id === 'roq') { S.ro.q = e.target.value; S.ro.page = 1; }
  else return;
  render(); const el = $('#' + id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
window.addEventListener('hashchange', render);
window.PA = { role: () => { /* Mastercard role removed from the prototype */ }, S, render, go };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
})();
